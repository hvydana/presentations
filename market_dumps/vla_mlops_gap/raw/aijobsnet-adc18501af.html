function handlePrimaryListItems() {
  items = document.querySelectorAll('.list-group-item');
  items.forEach(item => {
    item.addEventListener('click', function(event) {
      items.forEach(i => i.classList.remove('bg-primary-subtle'));
      this.classList.add('bg-primary-subtle');
    });
  });
}
function showSearchListLoading(event) {
  const row = event.target.closest('li');
  if (!row || !row.parentElement) {
    event.detail.target.innerHTML = '...';
    return;
  }
  let next = row.nextElementSibling;
  while (next) {
    const current = next;
    next = next.nextElementSibling;
    current.remove();
  }
  const loading = document.createElement('li');
  loading.className = 'list-group-item';
  loading.textContent = '...';
  row.parentElement.appendChild(loading);
}
</script>
