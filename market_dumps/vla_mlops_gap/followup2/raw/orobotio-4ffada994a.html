  <script>window.__INITIAL_LANDING__={"hero":{"uuid":"d1e43c06-7f34-4e56-94fa-509690b37b48","name":"Microduck","slug":"microduck","description":"**Microduck** is a tiny bipedal robot — about 25 cm and 800 g — that walks, rolls, picks things up, and stands itself back up using reinforcement-learning policies. Fourteen Dynamixel XL330 servos are driven by neural policies at 50 Hz on an onboard computer, alongside an IMU, a camera, and audio.\n\nPick up a gamepad and drive it; put wheels on and it loads a different \"brain\"; knock it over and it gets back up. It also sits, kicks a ball, and quacks in a voice of its own.\n\n## Open source, but you assemble it yourself\n\nMicroduck is **Apache-2.0 open source**, and that license covers more than the code — the sim + 3D models, the electronics, and the setup docs are all published across Pollen Robotics GitHub:\n\n- **Code / brain:** [pollen-robotics/microduck](https://github.com/pollen-robotics/microduck) — the Rust daemons that run the policies.\n- **3D models + RL sim:** [microduck_rl](https://github.com/pollen-robotics/microduck_rl) — the mjlab assets; the printable STLs on this page are derived from these sim meshes.\n- **Electronics — RPI Robot HAT:** [elec_RPI_Robot_HAT](https://github.com/pollen-robotics/elec_RPI_Robot_HAT) — a full KiCad project with production gerbers, BOM and pick-place files in the production/ folder, so you can order the board yourself (IMU, Dynamixel TTL/485, audio).\n- **Build a dev board:** [install-dev.md](https://github.com/pollen-robotics/microduck/blob/main/docs/robot/install-dev.md) — bring-up from a blank board.\n\n**The catch:** there is no single bill of materials or step-by-step build guide, exact part variants and fasteners are not specified, and the 3D models + parts list surfaced here are derived — reconstructed from the sim and schematics, so treat them as a starting point (possibly untested or incomplete). The only directly-supported way to get a working Microduck is the vendor kit.\n\nGet a ready-made Microduck at [pollen-robotics.com/microduck](https://pollen-robotics.com/microduck).\n\nSource: https://github.com/pollen-robotics/microduck · Creator: Pollen Robotics · License: Apache-2.0","category":"Humanoids","thumb":"https://storage.googleapis.com/orobot-stls/1787988573530-kickabout.webp","thumbSmall":"https://storage.googleapis.com/orobot-stls/1787988573530-kickabout.thumb640w.webp","thumbMedium":"https://storage.googleapis.com/orobot-stls/1787988573530-kickabout.thumb1400w.webp","author":{"uuid":"4ed10a31-76b1-45af-bc66-913c7be98a3b","name":"BROKER-2","username":"BROKER-2","profilephoto":"https://storage.googleapis.com/orobot-stls/pp%2F1777079987855-scav-pfp.png"},"installCount":3,"bom":true,"bomMeta":{"estimatedCostUsd":[399,399]}},"programs":[{"uuid":"8208e34a-3586-4aea-8858-0e43e99221cc","name":"Reachy Mini","slug":"reachy-mini","subtitle":"Expressive open-source robot for hackers and AI builders","description":"# Reachy Mini — Open-Source Expressive Desktop Robot\n\nAn open-source desktop robot designed for hackers and AI builders who want a tangible platform for multimodal interaction experiments. Ships as a flat-pack 3D-printed kit that assembles in roughly 2–3 hours: **6-DOF Stewart-platform head**, two antennas, and a rotating base packed with sensors.\n\n**Kit-first product** from Pollen Robotics / Hugging Face — \"from $299\" reflects kit pricing. Full CAD, firmware, and software are Apache 2.0 (software) / CC BY-NC-SA (hardware).\n\n## Hardware Tiers\n\n| Tier | Price | Compute | Power | Best for |\n|------|-------|---------|-------|----------|\n| **Wireless** | ~$449 | RPi Compute Module 4 | Onboard battery + Wi-Fi | Fully untethered operation, includes IMU |\n| **Lite** | ~$299 | None (host PC) | USB-C tethered | Developers with GPU, streams sensor data + trajectories over USB-C |\n\nBoth share the same kinematics and software stack. A MuJoCo simulation lets you prototype before printing a single part.\n\n## Capabilities\n\n- Wide-angle camera, mic array, speaker, IMU → multimodal input\n- Python SDK with vision, speech, and LLM helpers\n- One-click app install from the Hugging Face Spaces dashboard (LLM conversation, hand-tracking, internet radio)\n- Composable — every component can be re-printed, modified, or integrated into larger projects\n\n## Printing\n\nThe **Print All** set contains every printed structural part for one complete robot (head + Stewart-platform neck + rotating body + 2 antennas). Print x1 of each unless noted.\n\n**Head (6-DOF Stewart platform):**\n- `head_front_3dprint` + `head_back_3dprint` — head shell halves\n- `head_mic_3dprint` — in-head mic-array mount\n- `stewart_main_plate_3dprint` + `stewart_tricap_3dprint` — Stewart-platform plates\n- `neck_reference_3dprint` — neck linkage reference\n\n**Body / base:**\n- `body_top_3dprint`, `body_turning_3dprint`, `body_down_3dprint`, `body_foot_3dprint`\n\n**Antennas (x2 assemblies — print the L/R holders once each):**\n- `antenna_body_3dprint`, `antenna_interface_3dprint`, `antenna` plus `antenna_holder_l_3dprint` + `antenna_holder_r_3dprint`\n\n**Sensor mounts:**\n- `arducam`, `big_lens_d40`, `5w_speaker`\n\nNote: the 6-DOF head uses 6x Dynamixel XL330 servos and metal Stewart linkage arms (purchased/machined, not printed — see BOM). Bearings, screws and servo cases in the upstream CAD are hardware, not print parts. Material: ABS/PC.\n\n## Metadata\n\n- **Creator:** Pollen Robotics\n- **Kit vendor:** Hugging Face\n- **License:** Apache 2.0 (software) · CC BY-NC-SA (hardware)\n\n## Links\n\n- [Wireless Build Guide](https://github.com/pollen-robotics/reachy_mini)\n- [Lite Build Guide](https://github.com/pollen-robotics/reachy_mini)\n- [Python SDK — Installation](https://github.com/pollen-robotics/reachy_mini)\n- [Simulation / MuJoCo](https://github.com/pollen-robotics/reachy_mini)\n- [Hugging Face Spaces app store](https://huggingface.co/spaces)\n- [Upstream repo](https://github.com/pollen-robotics/reachy_mini)","category":"Humanoids","resources":[{"type":["raspberry-pi"]}],"thumb":"https://storage.googleapis.com/orobot-stls/1778190963836-reachy_mini_hello.gif","thumbSmall":"https://storage.googleapis.com/orobot-stls/1778190963836-reachy_mini_hello.thumb640w.webp","thumbMedium":"https://storage.googleapis.com/orobot-stls/1778190963836-reachy_mini_hello.thumb1400w.webp","author":{"uuid":"4ed10a31-76b1-45af-bc66-913c7be98a3b","name":"BROKER-2","username":"BROKER-2","profilephoto":"https://storage.googleapis.com/orobot-stls/pp%2F1777079987855-scav-pfp.png"},"installCount":8,"bom":true,"bomMeta":{"estimatedCostUsd":[399,1300]}},{"uuid":"a55744d9-159d-49ac-bdf1-e99d3820fd7c","name":"Berkeley Humanoid Lite","slug":"berkeley-humanoid-lite","description":"**Berkeley Humanoid Lite** is an open-source, **sub-$5,000** humanoid robot from UC Berkeley's Hybrid Robotics lab — a full 22-DOF biped (12 leg joints + 10 arm joints) built around **modular, fully 3D-printed cycloidal gearboxes** and widely available off-the-shelf parts. It was created to democratize humanoid-robotics research: every actuator is printed and hand-assembled, the electronics are commodity, and the entire software stack — RL policy training, sim-to-sim/sim-to-real, teleoperation, and low-level control — is open.\n\nThe robot walks (bipedal locomotion via a learned RL policy), and with its two 5-DOF arms and grippers it performs bimanual manipulation: solving a Rubik's cube, writing with a marker, and stacking blocks. Perception and control run on an onboard **x86 mini-PC**; joints connect over **CAN bus** through custom **STM32 (B-G431B-ESC1) motor controllers** running the open \"recoil\" firmware, with a **BNO085 IMU** for balance.\n\n### What this orobot program is\nThis is a **browser-based learning interface** and entry point. The in-page 3D viewer shows the robot's per-link meshes, and the Robot Operator panel drives the 22 joints through poses and demo sequences (stand, wave, squat, march) so you can understand the kinematic layout. It is **not** the balancing locomotion controller — that lives in the low-level repo below. Use this to learn the layout, then dive into the source to build and deploy the real thing.\n\n### Build it for real\n- **Paper (arXiv 2504.17249):** https://arxiv.org/abs/2504.17249\n- **Project site:** http://lite.berkeley-humanoid.org/\n- **Build docs (GitBook):** https://berkeley-humanoid-lite.gitbook.io/docs\n- **Video:** https://youtu.be/dIdJGkMDFl4\n- **Main repo (training + deploy):** https://github.com/HybridRobotics/Berkeley-Humanoid-Lite\n- **Low-level control (CAN + RL runtime):** https://github.com/HybridRobotics/Berkeley-Humanoid-Lite-Lowlevel\n- **CAD / URDF / MJCF / STL assets:** https://github.com/HybridRobotics/Berkeley-Humanoid-Lite-Assets\n\n### Highlights\n- **22 DOF** — two 6-DOF legs + two 5-DOF arms, built from two modular actuator types (10× M6C12, 12× 5010)\n- **Fully 3D-printed actuators** — cycloidal gearboxes in PLA around MAD M6C12 (150KV) and 5010 (110KV) BLDC motors\n- **Commodity BOM** — ~$205 per M6C12 actuator, ~$154 per 5010; **$4,794 for the whole robot** at verified September 2026 prices (filament excluded)\n- **URDF / MJCF / USD** descriptions included — sim-ready in Isaac Lab & MuJoCo\n- **RL locomotion + bimanual manipulation** — trained policies (ONNX) ship in the repo\n\n### Attribution\nCreated by **Yufeng Chi, Qiayuan Liao, Junfeng Long, Xiaoyu Huang, Sophia Shao, Borivoje Nikolic, Zhongyu Li, and Koushil Sreenath** (UC Berkeley Hybrid Robotics). Code licensed **MIT**; hardware/CAD assets licensed **CC BY-SA 4.0**. This program mirrors their open-source project as a learning entry point — all credit to the original authors.","category":"Humanoids","resources":[{"type":["linux"]}],"thumb":"https://storage.googleapis.com/orobot-stls/1786493214994-hero-irl.jpg","thumbSmall":null,"thumbMedium":null,"author":{"uuid":"4ed10a31-76b1-45af-bc66-913c7be98a3b","name":"BROKER-2","username":"BROKER-2","profilephoto":"https://storage.googleapis.com/orobot-stls/pp%2F1777079987855-scav-pfp.png"},"bom":true,"bomMeta":{"estimatedCostUsd":[4794,5280]}},{"uuid":"fde0548c-c5c3-42af-8005-0df83f58f9b5","name":"SpotMicro ESP32","slug":"spotmicro-esp32","description":"377 stars on GitHub · michaelkubina/SpotMicroESP32\n\nSpotMicroESP32 is Michael Kubina's redesign of the SpotMicro quadruped, derived from KDY0523's original Thingiverse design, optimized for support-free 3D-printing and built around an ESP32-DevKitC. 12-DOF (3 servos per leg). Source: https://github.com/michaelkubina/SpotMicroESP32\n\n**SpotMicro family — pick your compute target:**\n| Variant | Controller | ROS |\n|---------|-----------|-----|\n| SpotMicro (Pi) — mike4192 | Raspberry Pi | ROS Kinetic |\n| [SpotMicro Jetson Nano](/o/program/BROKER-2/spotmicro-jetson-nano) | Jetson Nano | ROS Melodic |\n| **SpotMicro ESP32 (this)** | ESP32-DevKitC | No ROS |\n\nHardware:\n- 12 servos (3 per leg: shoulder yaw, upper, lower)\n- ESP32-DevKitC main controller\n- Optional ESP32-CAM for vision\n- LiPo battery with custom mounting brackets\n\nSoftware ecosystem (community forks):\n- Maarten Weyn BLE/IK firmware: https://github.com/maartenweyn/SpotMicro_ESP32\n- Blacksheep Nitro Fork (PCB + walking gait + RC): https://github.com/Blacksheep909/SpotMicroESP32-Nitro-Fork\n- SpotMicro-Leika (FreeRTOS + 2 gaits): https://github.com/runeharlyk/SpotMicroESP32-Leika\n- SpotMicroAI Community: https://spotmicroai.readthedocs.io/\n\nResources:\n- Thingiverse: https://www.thingiverse.com/thing:4559827\n- Original SpotMicro by KDY0523: https://www.thingiverse.com/thing:3445283\n\n## Printing\n\nSpotMicro is a 12-DOF quadruped — 4 legs, 3 servos each — so the shoulder and limb parts must be printed once per leg (×4), and the chassis side is printed as a left/right pair (×2). This is the support-free Kubina redesign, so no supports are needed.\n\nPrint quantities: Chassis_Side ×2; Front_Cover ×1, Rear_Cover ×1, Cameramount ×1. Per leg (×4 each): Bottom_Shoulder, Inner_Shoulder, Outer_Shoulder, Limb_Ball_Bearing_Mount, Limb_Bottom_Shell, Limb_Top_Shell, Limb_Servohorn_Mount, Foot_Tip.\n\nNote on Rear_Cover: the file is labelled a \"Template.\" It is a customizable base cover meant to be edited (e.g. to add a cutout for your specific electronics/port layout) before printing, rather than a fixed final part — print it as-is if you don't need a custom opening. The upstream source also includes many experimental and alternate variants (different power-board mounting plates, optimized covers, mold parts); those are optional alternates and are intentionally excluded from this set, which is one clean buildable SpotMicro.","category":"Mobile Robots","resources":[{"type":["esp32"]}],"thumb":"https://storage.googleapis.com/orobot-stls/1778191005667-spotmicroESP32.jpg","thumbSmall":"https://storage.googleapis.com/orobot-stls/1778191005667-spotmicroESP32.thumb640w.webp","thumbMedium":"https://storage.googleapis.com/orobot-stls/1778191005667-spotmicroESP32.thumb1400w.webp","author":{"uuid":"4ed10a31-76b1-45af-bc66-913c7be98a3b","name":"BROKER-2","username":"BROKER-2","profilephoto":"https://storage.googleapis.com/orobot-stls/pp%2F1777079987855-scav-pfp.png"},"installCount":2,"bom":true,"bomMeta":{"estimatedCostUsd":[130,420]}},{"uuid":"a07cafdf-ef93-438d-a715-0da14d329ede","name":"XLeRobot Dual-Arm Mobile Home Robot","slug":"xlerobot-dual-arm-mobile-home-robot","subtitle":"Low-cost dual-arm mobile robot for embodied AI and household manipulation","description":"XLeRobot is a low-cost (~$660) open-source dual-arm mobile manipulator built on **LeRobot + 2× [SO-101 arms](/o/program/BROKER-2/so-101-teleop-arm)** mounted on an **IKEA RÅSKOG utility cart**. Designed for household manipulation tasks and embodied AI research, it can be fully assembled in under 4 hours. By Gaotian (Vector Wang). MIT license.\n\n**Source:** [github.com/Vector-Wangel/XLeRobot](https://github.com/Vector-Wangel/XLeRobot) · [Docs (v0.3.0)](https://xlerobot.readthedocs.io)\n\n## Capabilities\n\n- **Dual 5-DOF SO-101 arms** with 17× STS3215 (12 V, 30 kg·cm) servos — ~40 cm reach, ~600–1000 g payload per arm\n- **Omni-wheel holonomic base** (Lekiwi-style with 3× VEX 4\" omni wheels)\n- **Compute:** laptop primary; Raspberry Pi optional (+$79, not required)\n- **LeRobot plug-and-play:** supports VLA models, datasets, sim2real (MuJoCo / Maniskill URDFs)\n- **Teleop:** keyboard, Xbox/Switch Joycon controller, or VR\n- **Power:** Anker SOLIX C300 portable power station\n\n## Printing\n\nThe **Print All** set is the curated **v0.3.0** build of one robot: two SO-101-derived arms on a wheeled IKEA-cart base with a single head camera. Where the upstream CAD ships several alternates, this set keeps one canonical choice each; the alternates are listed at the end if you need them.\n\n**Arm parts (SO-101 derived) — print x2 (one per arm):**\n- `Base`, `Base_Motor`, `Fixed_Jaw`, `Fixed_Jaw_Motor`, `Moving_Jaw`, `Ender_Follower_SO101`, `SO101_soft_fin` (TPU95A for the finray fingers)\n\n**Mobile base / drive:**\n- `XLeRobot-0-3-0-new-wheel-connector` (v0.3.0 base connector)\n- `035wheel` — VEX-style OMNI wheel (matches BOM); print x4 (one per drive wheel)\n- `Brushlessmotor-connector` — print x4\n- `3_8-Hex-Bore-Plastic-VersaHub-217-5828-v2` — wheel hub; print x3\n- `94868A713_NO-THREADS_Female-Threaded-Hex-Standoff` — print x4\n\n**Head camera (pick to match your camera):**\n- `Gimbal_mesh_all_d435` — for Intel RealSense **D435** (default here)\n\n**Not in Print All (alternates — add manually only if needed):**\n- Camera: `Gimbal_mesh_all_d455` (RealSense D455 instead of D435).\n- Drive: `mecanum_wheel_motor_coupling` (mecanum wheels instead of the BOM's OMNI wheels).\n- Design revisions: `XLeRobot_0_4_0_extra` (0.4.0 dual-wheel/versatile arm base), `XLeRobot_035_armbase`, `Base_08q-v1`.\n\nPrint quantities above replace the duplicate vendor files that were previously listed once per copy.\n\n## Gotchas\n\n- **Not** designed for in-hand dexterity, lifts over 1 kg per arm, or dynamic motion\n- Fixed height (IKEA RÅSKOG cart defines the base — no height adjustment)\n- Upgrade path from existing SO-101 + Lekiwi for ~$250 extra (no motor-ID changes needed)\n- Assembly kit available from Wowrobo (~$579, excludes Anker battery and IKEA cart)\n\n## Attribution\n\n**Creator:** Gaotian / Vector Wang\n**License:** MIT\n**Built on:** LeRobot · SO-101 · Lekiwi · Bambot ecosystems\n\n## Build Guide\n\nFull documentation, assembly instructions, and BOM: [xlerobot.readthedocs.io](https://xlerobot.readthedocs.io/en/latest/index.html)","category":"Mobile Robots","resources":[{"type":["raspberry-pi"]}],"thumb":"https://storage.googleapis.com/orobot-stls/1778190831141-image-0.png","thumbSmall":null,"thumbMedium":null,"author":{"uuid":"4ed10a31-76b1-45af-bc66-913c7be98a3b","name":"BROKER-2","username":"BROKER-2","profilephoto":"https://storage.googleapis.com/orobot-stls/pp%2F1777079987855-scav-pfp.png"},"installCount":6,"bom":true,"bomMeta":{"estimatedCostUsd":[660,960]}},{"uuid":"5420a247-8f8b-4292-9a67-f23e4eea3f33","name":"AlohaMini Dual-Arm Mobile","slug":"alohamini-dual-arm-mobile","description":"# AlohaMini — Dual-Arm Mobile Manipulation Platform\n\nA **miniaturized Aloha-style dual-arm mobile platform** with a **motorized vertical lift column**. Two SO-ARM101 follower arms sit on a shared lift tower mounted to a three-wheel omni base, giving the platform a tabletop-to-floor reach envelope that makes real household-scale manipulation possible at hobbyist cost.\n\n## What makes AlohaMini distinctive\n\nMost DIY bi-manual mobile bases have one big gap: they're too short. An SO-ARM on a fixed 20-cm pedestal can't pick up something on the floor *or* reach a countertop — the workspace is stuck at one height. AlohaMini solves this with a **powered vertical lift** that raises both arms together, scanning the full vertical reach of a human workspace.\n\nPaired with:\n\n- Two **SO-ARM101 follower arms** (leader arms for teleop are also included in the STL set)\n- A **three-omniwheel kiwi drive base** (bearing-mounted axles, printed chassis)\n- Seeed Studio XIAO + WaveShare Dynamixel bus driver mounts\n- Camera wrist mounts on both arms\n\n## What you can do with it\n\n- **Imitation learning at floor and table height** — record bimanual episodes where the arms need to descend to grab something off the floor, then lift to place it on a surface.\n- **Mobile bimanual teleop** — pair with two leader arms (also in the STL set) to drive both follower arms plus the base from a single operator.\n- **VLA training data collection** — the shared base frame + lift + dual arms is close to the canonical \"robot\" embodiment used in recent VLA papers (RT-2, OpenVLA).\n- **Household tasks** — clearing a dining table, loading a dishwasher, or picking laundry off the floor — all things a fixed-height arm can't attempt.\n\n## Printed parts\n\n~60 STLs — dual SO-ARM101 arms (follower grippers + leader handles), motorized lift column, 3-omniwheel base, battery tray, VR teleop handles; see Print Files.\n\n## Attribution & license\n\n- Designer: **Yi-Teng Li (liyiteng)**\n- Upstream: https://github.com/liyiteng/AlohaMini\n- License: **Apache 2.0**\n- Built on: [SO-ARM101](https://github.com/TheRobotStudio/SO-ARM100), [LeKiwi](https://github.com/SIGRobotics-UIUC/LeKiwi) base geometry, and the [ALOHA/ALOHA2](https://aloha-2.github.io/) dual-arm research lineage from Stanford\n\n## Links\n\n- Upstream: https://github.com/liyiteng/AlohaMini\n- LeRobot: https://github.com/huggingface/lerobot\n- ALOHA paper: https://tonyzhaozh.github.io/aloha/\n\n\n## Build Guide\n\nHardware assembly guide (BOM, wiring, mechanical assembly): [github.com/liyiteng/AlohaMini/blob/main/docs/hardware_assembly.md](https://github.com/liyiteng/AlohaMini/blob/main/docs/hardware_assembly.md)\n\n## Printing\n\nThis is one **complete dual-arm mobile platform**: two SO-ARM101 follower arms + two leader arms (for teleop) on a shared lift column over a 3-omniwheel base. The 20 STLs use a role-prefix naming scheme, and most are **printed in multiples** — printing one of each gives only a fraction of a build. Quantities below are per platform:\n\n**`D_` — shared SO-ARM101 arm parts (print 4× each: 2 followers + 2 leaders):**\n- D_Base_SO101_Lekiwi, D_Base_motor_holder_SO101, D_Motor_holder_SO101_Base, D_Motor_holder_SO101_Wrist, D_Rotation_Pitch_SO101, D_Under_arm_SO101, D_Upper_arm_SO101, D_Wrist_Roll_Pitch_SO101, D_Wrist_Roll_SO101\n\n  These are the common arm-segment parts every SO-ARM101 needs, so each is printed **×4** (one per arm). The two controller-mount plates are an either/or per your electronics: **D_Seeedstudio_Mounting_Plate** (Seeed XIAO) vs **D_WaveShare_Mounting_Plate** (WaveShare bus driver) — print whichever board(s) you use, ×4 if used on all arms.\n\n**`F_` — follower-only parts (print 2×: one per follower arm):**\n- F_Follower_Moving_Jaw_SO101, F_Follower_Wrist_Roll_Follower_SO101, F_Follower_SO-ARM101_camera_wrist_mount\n\n**`L_` — leader-only parts (print 2×: one per leader/teleop handle):**\n- L_Leader_Handle_SO101, L_Leader_Trigger_SO101\n\n**`OB_` — omni-base (kiwi drive, 3 wheels):**\n- OB_Chassis_Servo_Mount ×3, OB_Chassis_Bearing_Cover ×3, OB_Chassis_Shaft_Sleeve_12_24 ×3 (one set per omni wheel)\n- OB_Chassis_Side_Panel ×2–3 (chassis sides — match to your frame)\n\nSo the 20 unique STLs expand to roughly **~60 physical prints** (≈4 kg PLA per the BOM). Servo count: 16× STS3215-C018 (4 base + 12 follower arms) and 12× STS3215-C046 (leader arms). Leader and follower parts are both required for teleop data collection — they are **not** alternates. Note: the lift-column structural parts referenced in the build guide are large and may be cut/printed per the upstream `hardware` folder; this Print All set covers the arm, gripper, base and teleop-handle parts.","category":"Mobile Robots","resources":[{"type":["raspberry-pi"]}],"thumb":"https://storage.googleapis.com/orobot-stls/1777040923513-alohamini_git.png","thumbSmall":"https://storage.googleapis.com/orobot-stls/1777040923513-alohamini_git.thumb640w.webp","thumbMedium":"https://storage.googleapis.com/orobot-stls/1777040923513-alohamini_git.thumb1400w.webp","author":{"uuid":"4ed10a31-76b1-45af-bc66-913c7be98a3b","name":"BROKER-2","username":"BROKER-2","profilephoto":"https://storage.googleapis.com/orobot-stls/pp%2F1777079987855-scav-pfp.png"},"bom":true,"bomMeta":{"estimatedCostUsd":[750,900]}},{"uuid":"2542a3e1-2212-4345-8f99-c70e4c5b5d6e","name":"Stack-chan","slug":"stack-chan","description":"1,382 stars on GitHub.\n\n# Stack-chan — Palm-Sized Companion Robot\n\nStack-chan is a palm-sized, open-source companion robot driven by an M5Stack microcontroller and JavaScript firmware. Created by Shinya Ishikawa, Stack-chan sits on your desk, turns its head to watch you, expresses emotions on its built-in display, and responds through speech.\n\n**Source:** https://github.com/stack-chan/stack-chan\n\n## Capabilities\n\n- Servo-driven head gaze/tracking\n- Emotive faces (happy, angry, sad) + fully customizable face expressions\n- Speech synthesis\n- Composable behaviors (\"mods\") — mix and layer: expressions, tracking, speech, M5Unit addon support\n- Programmable in JavaScript on the **Moddable SDK** (embedded JS framework; no C/Arduino required)\n\n## Servo Paths — Pick Before You Print\n\nTwo mutually exclusive configurations that change both the case geometry and electronics:\n\n| Path | Servos | Notes |\n|------|--------|-------|\n| **PWM** | SG90 / MG90S | Simpler, cheaper, standard hobby servo wiring |\n| **Serial TTL** | RS30X series | Smoother motion, requires a buffer IC and serial-servo case geometry |\n\nPicking a path determines which STL set and which PCB you build.\n\n## Build Notes\n\n- Requires a **custom PCB** — order Gerbers from JLCPCB/PCBWay (`schematics/` directory in the repo)\n- Modular 46-part printable enclosure (shell, bracket, feet, spacer, accessories: hat, backpack variants, Lego adapter)\n- An official **commercial M5Stack version** (StackChan) is available; the open-source org fork is the reference for DIY\n\n## Metadata\n\n- **GitHub stars:** 1,382\n- **Author:** Shinya Ishikawa & community\n- **License:** Apache 2.0\n\n## Links\n\n- [Firmware (`firmware/`)](https://github.com/stack-chan/stack-chan/tree/main/firmware)\n- [STLs (`case/`)](https://github.com/stack-chan/stack-chan/tree/main/case)\n- [Schematics + PCB (`schematics/`)](https://github.com/stack-chan/stack-chan/tree/main/schematics)\n- [Roadmap](https://github.com/stack-chan/stack-chan/blob/main/docs/ROADMAP.md)\n- [Demo video (YouTube, EN subs)](https://www.youtube.com/@meganetaaan)","category":"Humanoids","resources":[{"type":["esp32"]}],"thumb":"https://storage.googleapis.com/orobot-stls/1778190892347-stackchan.gif","thumbSmall":null,"thumbMedium":null,"author":{"uuid":"4ed10a31-76b1-45af-bc66-913c7be98a3b","name":"BROKER-2","username":"BROKER-2","profilephoto":"https://storage.googleapis.com/orobot-stls/pp%2F1777079987855-scav-pfp.png"},"bom":true,"bomMeta":{"estimatedCostUsd":[130,175]}},{"uuid":"4a13d09e-7a75-4667-a0e3-9651d1fc96b8","name":"CogniFly — Foldable Collision-Resilient Nano Drone","slug":"cognifly","description":"CogniFly is an open-source, foldable, collision-resilient nano/micro quadcopter UAV with a soft exoskeleton inspired by insect morphology. The frame is assembled from 3D-printed flexible TPU parts and rigid PLA parts, connected by carbon fiber or bamboo strut rods that act as energy-absorbing springs on impact. At under 250g, it carries a Raspberry Pi Zero W for autonomous flight, a flight controller running INav/BetaFlight, and supports optical flow, lidar altitude hold, and camera-based computer vision. The collision-resilient design allows the frame to flex and absorb crash energy, making it ideal for research in cluttered or GPS-denied environments.\n\nThe frame ships in multiple design generations; the **Latest** folder contains the current canonical PLA + TPU parts. All red-colored parts in the renders are TPU 95A (flexible). The only part requiring print supports is `Battery_holder_magnetic_lid.stl`. Strut lengths: 8× 195mm (outer cage), 8× 97mm (arms), 4× 72mm (legs).\n\n## Attribution\n\n**Author:** thecognifly (Ricardo de Azambuja et al.)\n**GitHub:** https://github.com/thecognifly/CogniFly-STL\n**Project site:** https://thecognifly.github.io/\n**License:** See repository (research/academic project)\n**Source repo:** https://github.com/thecognifly/CogniFly-STL","category":"Other Robots","resources":[{"type":["raspberry-pi"]}],"thumb":"https://storage.googleapis.com/orobot-stls/1780198532501-CogniFly.jpg","thumbSmall":"https://storage.googleapis.com/orobot-stls/1780198532501-CogniFly.thumb640w.webp","thumbMedium":"https://storage.googleapis.com/orobot-stls/1780198532501-CogniFly.thumb1400w.webp","author":{"uuid":"4ed10a31-76b1-45af-bc66-913c7be98a3b","name":"BROKER-2","username":"BROKER-2","profilephoto":"https://storage.googleapis.com/orobot-stls/pp%2F1777079987855-scav-pfp.png"},"bom":true,"bomMeta":{"estimatedCostUsd":[200,350]}},{"uuid":"214e9ba8-cf80-4c05-bf35-91d8e9b6bae3","name":"SO-101 Teleop Arm","slug":"so-101-teleop-arm","description":"","category":"Arm Robots","resources":[{"type":["raspberry-pi"]}],"thumb":"https://storage.googleapis.com/orobot-stls/1778191310154-Leader_And_Follower_SO100.jpg","thumbSmall":"https://storage.googleapis.com/orobot-stls/1778191310154-Leader_And_Follower_SO100.thumb640w.webp","thumbMedium":"https://storage.googleapis.com/orobot-stls/1778191310154-Leader_And_Follower_SO100.thumb1400w.webp","author":{"uuid":"4ed10a31-76b1-45af-bc66-913c7be98a3b","name":"BROKER-2","username":"BROKER-2","profilephoto":"https://storage.googleapis.com/orobot-stls/pp%2F1777079987855-scav-pfp.png"},"installCount":3,"bom":true,"bomMeta":{"estimatedCostUsd":[359,380]}},{"uuid":"33315399-fb0d-4224-b443-1a21bc4e9f76","name":"ROBOTO_ORIGIN Humanoid","slug":"roboto-origin-humanoid","description":"","category":"Humanoid","resources":[{"type":["raspberry-pi"]}],"thumb":"https://storage.googleapis.com/orobot-stls/1780195865142-1280X1280.JPEG","thumbSmall":"https://storage.googleapis.com/orobot-stls/1780195865142-1280X1280.thumb640w.webp","thumbMedium":"https://storage.googleapis.com/orobot-stls/1780195865142-1280X1280.thumb1400w.webp","author":{"uuid":"4ed10a31-76b1-45af-bc66-913c7be98a3b","name":"BROKER-2","username":"BROKER-2","profilephoto":"https://storage.googleapis.com/orobot-stls/pp%2F1777079987855-scav-pfp.png"},"bom":true,"bomMeta":{"estimatedCostUsd":[6960,6960]}},{"uuid":"d880d4af-71e8-4acb-9a29-26d6958627cd","name":"Sesame Quadruped","slug":"sesame-quadruped","description":"1,619 stars on GitHub.\n\nSesame is an affordable, open-source mini quadruped robot powered by an ESP32 microcontroller. Designed by Dorian Borian, Sesame uses 8 MG90S metal-gear servos (two per leg) for 8-DOF locomotion and features a 128×64 OLED display that serves as an expressive robot face.\n\nSource: https://github.com/dorianborian/sesame-robot\n\n\nAll mechanical parts are fully 3D-printable on a standard FDM printer. The hardware folder contains both parametric STEP and Fusion 360 source models alongside the STL files, allowing full customization. The frame, internal structure, covers, and leg segments are all available as individual STLs.\n\nThe ESP32 firmware handles inverse kinematics, face animations on the OLED display, and a WiFi-based control interface accessible from any browser. A desktop companion app (Sesame Studio) is included for easy gait configuration and pose tuning without writing code.\n\nCommunity documentation covers full assembly with detailed wiring diagrams and a comprehensive BOM. Hat variants are available (enclosed, open, cat ears) for personality customization. With over 1600 GitHub stars, Sesame has become a go-to beginner quadruped platform.\n\nLicense: Apache 2.0.","category":"Mobile Robots","resources":[{"type":["esp32"]}],"thumb":"https://storage.googleapis.com/orobot-stls/1778193524309-image-0.png","thumbSmall":null,"thumbMedium":null,"author":{"uuid":"4ed10a31-76b1-45af-bc66-913c7be98a3b","name":"BROKER-2","username":"BROKER-2","profilephoto":"https://storage.googleapis.com/orobot-stls/pp%2F1777079987855-scav-pfp.png"},"installCount":11,"bom":true,"bomMeta":{"estimatedCostUsd":[85,190]}},{"uuid":"f8ecd8dd-fc1c-48b1-be99-f7213e619ed8","name":"vdar — 3D LiDAR Scanner","slug":"vdar-3d-lidar-scanner","description":"","category":"Camera Bots","resources":[{"type":["esp32"]}],"thumb":"https://storage.googleapis.com/orobot-stls/1781372565671-vdar-hero.png","thumbSmall":"https://storage.googleapis.com/orobot-stls/1781372565671-vdar-hero.thumb640w.webp","thumbMedium":"https://storage.googleapis.com/orobot-stls/1781372565671-vdar-hero.thumb1400w.webp","author":{"uuid":"4ed10a31-76b1-45af-bc66-913c7be98a3b","name":"BROKER-2","username":"BROKER-2","profilephoto":"https://storage.googleapis.com/orobot-stls/pp%2F1777079987855-scav-pfp.png"},"bom":true,"bomMeta":{"estimatedCostUsd":[100,150]}},{"uuid":"e09f4a1d-9cea-418e-bcf1-f8bc98f04a71","name":"MiniHawk-VTOL","slug":"minihawk-vtol","description":"The MiniHawk-VTOL is a fully 3D-printed tricopter/fixed-wing hybrid VTOL aircraft designed by Steve Carlson. It uses three brushless DC motors — two tilting front motors for forward flight and yaw control, and one fixed rear motor for hover — plus four servos for elevon control surfaces and motor tilt. The 800mm wingspan plank-style airframe weighs ~460g printed in PLA, with a total all-up weight of 1000–1200g. Designed for ArduPlane/ArduPilot firmware, it supports R/C, FPV, and autonomous UAV experimentation.\n\n## Attribution\n**Designer:** Steve Carlson (StephenCarlson)  \n**License:** CC-BY-NC-SA 4.0  \n**Source:** https://github.com/StephenCarlson/MiniHawk-VTOL  \n**Project Page:** https://hackaday.io/project/175286-minihawk-vtol","category":"Other Robots","resources":[{"type":["raspberry-pi"]}],"thumb":"https://storage.googleapis.com/orobot-stls/1780193996668-MiniHawkIso.png","thumbSmall":"https://storage.googleapis.com/orobot-stls/1780193996668-MiniHawkIso.thumb640w.webp","thumbMedium":"https://storage.googleapis.com/orobot-stls/1780193996668-MiniHawkIso.thumb1400w.webp","author":{"uuid":"4ed10a31-76b1-45af-bc66-913c7be98a3b","name":"BROKER-2","username":"BROKER-2","profilephoto":"https://storage.googleapis.com/orobot-stls/pp%2F1777079987855-scav-pfp.png"},"bom":true,"bomMeta":{"estimatedCostUsd":[200,350]}},{"uuid":"ba48e445-2ae0-493e-b2aa-c0345790731f","name":"Open Duck Mini","slug":"open-duck-mini","description":"3,406 stars on GitHub.\n\n# Open Duck Mini — Bipedal BDX Droid Replica\n\nSource: https://github.com/apirrone/Open_Duck_Mini\n\n\nA **miniature bipedal character robot** inspired by Disney's BDX droid — the small two-legged star of the *Galactic Starcruiser* walkabout experience. Standing roughly **42 cm tall** with its legs extended, Open Duck Mini v2 recreates the droid's expressive, duck-like gait in a fully open-source design that targets a **complete bill of materials under $400**.\n\nThe mechanical design is authored in Onshape and simulated in MuJoCo, with locomotion trained end-to-end through reinforcement learning. The project has put heavy work into **sim-to-real transfer**, publishing trained ONNX walking policies that run on the robot itself. The onboard runtime executes those policies on a **Raspberry Pi Zero 2 W**, and the training stack is moving to MuJoCo Playground alongside a reference-motion generator for imitation learning.\n\nPlanned \"expression\" features — LED eyes, a camera, a speaker and a microphone — extend the base walker into a fuller character robot and can be added after the build. The project is documented as it evolves (print guide, assembly guide, and a community Tnkr build guide), backed by an active Discord community, and sponsored by Hugging Face and Pollen Robotics.","category":"Humanoids","resources":[{"type":["raspberry-pi"]}],"thumb":"https://storage.googleapis.com/orobot-stls/1778190523585-image-3.png","thumbSmall":"https://storage.googleapis.com/orobot-stls/1778190523585-image-3.thumb640w.webp","thumbMedium":"https://storage.googleapis.com/orobot-stls/1778190523585-image-3.thumb1400w.webp","author":{"uuid":"4ed10a31-76b1-45af-bc66-913c7be98a3b","name":"BROKER-2","username":"BROKER-2","profilephoto":"https://storage.googleapis.com/orobot-stls/pp%2F1777079987855-scav-pfp.png"},"installCount":5,"bom":true,"bomMeta":{"estimatedCostUsd":[500,650]}},{"uuid":"43544204-9885-413c-91a8-b6a2fec2feaf","name":"Stringman","slug":"stringman-cable-crane-robot-2","subtitle":"Room scale cable driven parallel robot","description":"Stringman is an open-source room-scale cable-suspended crane robot by Neufangled Robotics. Multiple anchor units mount on walls or ceiling and each reel a cable under computer control to suspend and precisely position a gripper anywhere in 3D space — like a miniature industrial cable robot for your home.\n\nThe system uses computer vision (apriltags + calibrated cameras on each anchor) and a Kalman-filter position estimator to achieve millimeter-level positioning without encoders on the gantry itself. An optional ML model (PyTorch, runs on NPU or GPU) enables autonomous object detection and pick-and-place sequences.\n\n**Key specs:**\n- Architecture: parallel cable robot (4 anchors + 1 gripper unit)\n- Anchors: MKS42C stepper motors or DM-H6215 BLDC, Raspberry Pi Zero 2W per anchor\n- Gripper: servo-actuated (InventorHATMini), BNO085 IMU, VL53L1X laser rangefinder\n- Host controller: PC/laptop — min 8 cores, 8 GB RAM, PyTorch acceleration required\n- Control protocol: WebSocket + Protobuf over mDNS-discovered LAN connections\n- Firmware: Python (nf_robot package), Apache 2.0\n- Hardware designs: CERN-OHL-W 2.0\n\n**Cost:** $210–$1000 depending on configuration — gripper-only kit starts at ~$210; full 4-anchor + gripper assembled system runs ~$1000. See the [store](https://neufangled.com/store) for current kit tiers.\n\n**Attribution:** Built by Nathan Fong / Neufangled Robotics.\n\n**License:** Hardware: CERN-OHL-W 2.0 (weakly reciprocal — modifications to hardware must be released); Firmware: Apache 2.0.\n\n**Source:** https://github.com/nhnifong/cranebot3-firmware\n\n**Hardware CAD:** https://neufangled.com/docs/downloads/\n\n**Docs & build guides:** https://neufangled.com/docs\n\n**Store:** https://neufangled.com/store","category":"Other Robots","resources":[{"type":["raspberry-pi"]}],"thumb":"https://storage.googleapis.com/orobot-stls/1778876766447-nf-stringman_copper.jpg","thumbSmall":"https://storage.googleapis.com/orobot-stls/1778876766447-nf-stringman_copper.thumb640w.webp","thumbMedium":"https://storage.googleapis.com/orobot-stls/1778876766447-nf-stringman_copper.thumb1400w.webp","author":{"uuid":"19c787b6-bca8-408c-a22d-24950409d487","name":"Nathaniel Nifong","username":"nathaniel-nifong","profilephoto":null},"bom":true,"bomMeta":{"estimatedCostUsd":[210,1000]}},{"uuid":"d5c41dbd-0942-46e4-88a7-84ae30679164","name":"LeRobot Humanoid (Biped Platform)","slug":"lerobot-humanoid-biped-platform","description":"The **LeRobot Humanoid (Biped Platform)** is a fully open-source, 3D-printed humanoid biped robot developed by Virgile Batto and the Hugging Face LeRobot team. Powered by a Raspberry Pi 5 and 12 RobStride CAN-FD actuators arranged across two legs (6 degrees of freedom per leg, 12 DOF total), it represents a serious open-hardware effort to make capable humanoid locomotion accessible to researchers and advanced builders worldwide. Every mechanical, electrical, and firmware artifact is freely available under the Apache 2.0 license, from the Onshape CAD source to the bill of materials to the motor commissioning scripts.\n\n## Creator & License\n\n**Author:** Virgile Batto (Hugging Face LeRobot team)\n\n**License:** Apache 2.0\n\n**Hardware repository (CAD, BOM, assembly docs, STLs):** https://github.com/Virgileboat/lerobot-humanoid-hardware\n\n**Runtime repository (motor control, gait, model inference):** https://github.com/Virgileboat/lerobot-humanoid-runtime\n\n**Public Onshape CAD document (start here for design exploration):** https://cad.onshape.com/documents/fb645318a27646d1d8840be6/w/d1cae8805fb652b4d1614997/e/804a1da43f242001a05129b4\n\nAll build assets — STL files, BOM CSVs, wiring diagrams, motor commissioning scripts — are republished here under the same Apache 2.0 terms.\n\n## Printing\n\nThe **Print All** set is complete — all 47 unique STLs for one full biped. Both legs are present as proper left/right mirror pairs (`_12` = left, `_22` = right). There are no missing parts and no alternates to deselect.\n\nThe build uses **~75 printed pieces** from these 47 files because several parts repeat. Until per-file print-multiples are supported, print the quantities below:\n\n**Print x4 each (bearing spacers, shared across both legs):**\n- `bearing_spacer14_5_7_3`, `bearing_spacer24_5_7_3`, `bearing_spacer34_5_7_3`, `bearing_spacer44_5_7_3`\n\n**Print x2 each (repeated per leg / both u-joints):**\n- `ujoint_ujoint`, `ujoint_hat_small_12`, `ujoint_hat_small_22`, `ujoint_spacer_12_ujoint`, `ujoint_spacer_22_ujoint`\n- `tibias2_rod_long`, `tibias2_rod_small`, `tibias2_hat_big`, `tibias2_shin_spacer_2`\n- `tibias_actuation_ankle_12`, `tibias_actuation_ankle_22`\n- `foot_foot`, `foot_hat_small`\n- `spacer12_5_9_4_5`, `spacer22_5_9_4_5`, `femur_v2_hat_femur_2`\n\n**Print x1:** every other file (the remaining torso, hip, femur and tibia parts — each left/right mirror is its own file).\n\nTotal: 47 files → ~75 physical parts (3–4 kg PLA+). Left and right parts are true mirrors and not interchangeable.\n\n## Hardware Requirements\n\nThis robot is **BYOD** (Bring Your Own Device). The orobot-firmware layer does not currently support RobStride CAN-FD actuators; all joint control runs directly on the Raspberry Pi through the [lerobot-humanoid-runtime](https://github.com/Virgileboat/lerobot-humanoid-runtime) repository. The orobot program record here serves as a build reference, asset hub, and control-interface stub.\n\n**Required hardware:**\n- **Raspberry Pi 5** (8 GB recommended) — primary compute\n- **SAVVYCANFD 2CH CAN-FD adapter** (USB, dual channel, 12 Mbps max) — connects Pi to motor bus\n- **12 × RobStride actuators:**\n  - 2 × RobStride O0 (torso/hip yaw)\n  - 2 × RobStride O2 (hip Z)\n  - 4 × RobStride O3 (thigh)\n  - 4 × RobStride O5 (shin)\n- **IMU:** BNO055 or BNO085 breakout board\n- **Mechanical:** ~75 custom 3D-printed PLA+ parts, plus precision bearings and fasteners per BOM\n\n## Specifications\n\n| Parameter | Value |\n|-----------|-------|\n| Degrees of freedom | 12 (6 per leg) |\n| Actuators | 12 × RobStride (CAN-FD) |\n| Estimated print weight | ~3–4 kg PLA+ |\n| Estimated total cost | ~$2,636 USD |\n| Skill level | Advanced |\n| Build time | Multi-week (motor commissioning → print → assembly → wiring → bring-up) |\n| CAD source | Onshape (public, link above) |\n| Control protocol | RobStride CAN-FD over USB adapter |\n\n## Build Start Sequence\n\nOrder long-lead items (motors, bearings, shoulder screws from `hardware/bom/bom_buy.csv`) first — they can take weeks. Print STLs per `docs/manufacturing/printing_guide.md` (~3–4 kg PLA+; orientation matters for structural leg parts). **Commission and ID every motor before any mechanical assembly** — protocol or ID errors after assembly require disassembling the leg to fix. Full step-by-step at [lerobot-humanoid-hardware](https://github.com/Virgileboat/lerobot-humanoid-hardware).\n\n## Safety\n\n> **High-torque actuators — a physical E-stop is required and must be accessible at all times during powered operation.** See `docs/safety.md` for the full bring-up checklist.\n\n## Attribution\n\nThis program page was created by the orobot BROKER-2 index to help builders find and start this project. All design credit goes to **Virgile Batto** and the Hugging Face LeRobot team. Please star the source repos if this build helps your project.","category":"Humanoids","resources":[{"type":["raspberry-pi"]}],"thumb":"https://storage.googleapis.com/orobot-stls/1779446055179-lerobot-hero.png","thumbSmall":"https://storage.googleapis.com/orobot-stls/1779446055179-lerobot-hero.thumb640w.webp","thumbMedium":"https://storage.googleapis.com/orobot-stls/1779446055179-lerobot-hero.thumb1400w.webp","author":{"uuid":"4ed10a31-76b1-45af-bc66-913c7be98a3b","name":"BROKER-2","username":"BROKER-2","profilephoto":"https://storage.googleapis.com/orobot-stls/pp%2F1777079987855-scav-pfp.png"},"installCount":1,"bom":true,"bomMeta":{"estimatedCostUsd":[2600,2700]}},{"uuid":"759b5292-5336-49ea-b445-d90cc5f6d59c","name":"Voron 0.2","slug":"voron-0-2","description":"**Voron Zero** is a compact, fully-enclosed CoreXY 3D printer designed for high-speed, high-quality printing in a small footprint. The V0.2 revision is the official release maintained by [Voron Design](http://vorondesign.com/voron0.2).\n\n## Highlights\n- 120 × 120 × 120 mm build volume\n- CoreXY motion system\n- Low-mass direct-drive extruder (Mini Stealthburner)\n- Fully enclosed chamber\n- 24V DC heated bed\n- Klipper firmware\n- Filament runout sensor\n- Sensorless homing\n\n## What's in this program\n- Full STL set for the V0.2r1 revision (134 printed parts)\n- Pointer to the official assembly manual PDF\n- Klipper firmware configuration profile\n- BOM via the [Voron Configurator](http://vorondesign.com/voron0.2)\n\n## Build notes\nMost first-timers buy a complete kit rather than sourcing à-la-carte — [LDO (~$800)](https://www.amazon.com/s?k=LDO+Voron+0.2+R1+kit), [Formbot (~$550)](https://www.amazon.com/s?k=Formbot+Voron+0.2), and [Fysetc](https://www.amazon.com/s?k=Fysetc+Voron+0.2) are the common choices. À-la-carte Misumi sourcing runs $400–600 but requires more lead time. Use the [Voron Configurator](https://vorondesign.com/voron0.2) to generate an accurate BOM for your region.\n\nThe Voron community provides an interactive [Printed Parts Guide](https://docs.google.com/spreadsheets/d/1MSgTiXazJwyfcTe7QqNIMWwQ_lfM8cOXmiMWPZ2HkEI/copy) and an active [Discord](https://discord.gg/voron) for build support. Expect a multi-weekend build for first-timers.\n\n## Links\n- [Voron-0 GitHub (STLs + manual)](https://github.com/VoronDesign/Voron-0)\n- [Official Assembly Manual PDF](https://github.com/VoronDesign/Voron-0/raw/Voron0.2r1/Docs/V0.2r1_Assembly_Manual.pdf)\n- [Voron Configurator (authoritative BOM)](https://vorondesign.com/voron0.2)\n- [Printed Parts Guide](https://docs.google.com/spreadsheets/d/1MSgTiXazJwyfcTe7QqNIMWwQ_lfM8cOXmiMWPZ2HkEI/copy)\n- [Voron Discord](https://discord.gg/voron)\n- [Klipper firmware docs](https://www.klipper3d.org/)\n\nSource: https://github.com/VoronDesign/Voron-0 (GPL-3.0)","category":"3D Printers","resources":[{"type":["raspberry-pi"]}],"thumb":"https://storage.googleapis.com/orobot-stls/1778194115972-voron0.2_bg.jpg","thumbSmall":"https://storage.googleapis.com/orobot-stls/1778194115972-voron0.2_bg.thumb640w.webp","thumbMedium":"https://storage.googleapis.com/orobot-stls/1778194115972-voron0.2_bg.thumb1400w.webp","author":{"uuid":"4ed10a31-76b1-45af-bc66-913c7be98a3b","name":"BROKER-2","username":"BROKER-2","profilephoto":"https://storage.googleapis.com/orobot-stls/pp%2F1777079987855-scav-pfp.png"},"installCount":3,"bom":true,"bomMeta":{"estimatedCostUsd":[550,900]}},{"uuid":"6f455adb-9f19-4381-b092-964cfb0d4204","name":"Hexapod","slug":"hexapod","description":"## Hexapod — 3D Printed Six-Legged Walking Robot\n\nA fully 3D-printed hexapod robot with 18 servo motors (three per leg) providing lifelike, agile locomotion. Designed by rookidroid.com, this project uses either an ESP32 or Raspberry Pi Pico W/2W controller board with built-in WiFi for wireless remote control. The firmware supports over-the-air (OTA) updates so you can iterate on motion patterns without touching the hardware.\n\nHexapod v2 is the recommended build. The original v1 used MG90S servos which are prone to failure; v2 upgrades to stronger 21G DS Power/Miuzei servos and is significantly more reliable. **Do not use MG90S.**\n\n**Note:** The controller board is proprietary to rookidroid.com. A generic ESP32 dev board can substitute — check the firmware docs for pin mapping.\n\n### Specifications\n\n| Property | Value |\n|----------|-------|\n| Legs | 6 |\n| Servos | 18 x 21G (3 per leg: hip, knee, ankle) |\n| Controller | ESP32 or Raspberry Pi Pico W/2W |\n| Communication | WiFi (UDP port 1234) + OTA updates |\n| Power | 2 x 18650 Li-ion cells |\n| Printed Parts | 20 STLs, all print without supports |\n| Print time | ~40–60 hours total |\n| Skill level | Intermediate |\n\n### Motion Modes\n\nThe ESP32 firmware implements a pre-computed look-up-table gait system with 18 motion modes including: directional walking at 0, 45, 90, 135 degrees (left and right variants), 180 degrees; fast forward and backward; turn left and right; climb forward and backward; body rotations on X, Y, Z axes; and a twist mode.\n\n### Attribution\n\nCreator: rookidroid.com\nSource: https://github.com/rookidroid/hexapod\nLicense: GNU GPL v3\n\n## Printing\n\nThis is a complete, modular set of 20 unique parts. Because the hexapod has 6 identical legs (each with 3 joints), many parts must be printed in multiples. Per the upstream build guide, print the following quantities:\n\nBody (print once each): body_base ×1, body_top ×1, body_top_cover ×1, body_battery ×1. Body (print in pairs): body_side ×2, body_front_back ×2. Servo brackets (one per leg): body_servo_side1 ×6, body_servo_side2 ×6, body_servo_top ×6.\n\nLegs and joints (per-leg multiples): joint_bottom ×12, joint_top ×12, joint_cross ×6, leg_bottom ×6, leg_top ×6, leg_side ×12. Feet (one set per leg): foot_bottom ×6, foot_top ×6, foot_ground ×6, foot_tip ×6.\n\nOptional: accessory_cable_holder ×1 (a cable-management add-on, not required for the robot to function).\n\nNo supports are needed — orient each part as shown in the upstream print thumbnails. All 20 files are the correct, current parts; there are no duplicates, alternates, or version variants to choose between.","category":"Mobile Robots","resources":[{"type":["esp32"]}],"thumb":"https://storage.googleapis.com/orobot-stls/1778191132215-hexapod_photo.jpg","thumbSmall":"https://storage.googleapis.com/orobot-stls/1778191132215-hexapod_photo.thumb640w.webp","thumbMedium":"https://storage.googleapis.com/orobot-stls/1778191132215-hexapod_photo.thumb1400w.webp","author":{"uuid":"4ed10a31-76b1-45af-bc66-913c7be98a3b","name":"BROKER-2","username":"BROKER-2","profilephoto":"https://storage.googleapis.com/orobot-stls/pp%2F1777079987855-scav-pfp.png"},"bom":true,"bomMeta":{"estimatedCostUsd":[120,200]}},{"uuid":"a632cab2-9253-40a2-846a-7c52aeaee2b4","name":"OpenBot","slug":"openbot","description":"3,262 stars on GitHub · MIT · Intel Labs + TU Munich\n\nOpenBot turns your smartphone into the brain of a low-cost robot — anyone with an Android or iOS device and ~$50 budget can build a capable AI-powered robot. Source: https://github.com/isl-org/OpenBot\n\nThe robot body is a 3D-printed differential-drive chassis holding two gear motors, a speed controller, and a custom PCB — all controlled by an **Arduino Nano**. The smartphone docks on top, providing the camera, CPU, and network stack. Your phone's neural engine runs person-following, autonomous navigation, and custom AI policies via the companion app.\n\n**4 body variants + phone mount** — regular (two-part top/bottom), block (PCB stack), glue (no-screw assembly), slim (narrow). See Print Files for the full set.\n\nThe project also supports tank, MTV off-road, and RTR RC-chassis variants.\n\n---\n\n## Install Notes\n\nOpenBot's intelligence lives in the **Android/iOS app** — vision, navigation, data collection, and AI inference all run on the phone. The orobot device code only bridges the **Arduino Nano motor controller layer** (forward/backward/turn via serial JSON). Higher-level behaviors (person following, autopilot, data recording) require the OpenBot app connected to the Arduino via **USB OTG cable**. The orobot integration is useful for basic motor testing and manual drive, but does not replicate the full OpenBot feature set.","category":"Mobile Robots","resources":[{"type":"arduino"}],"thumb":"https://storage.googleapis.com/orobot-stls/1778193554090-RTR_520.jpg","thumbSmall":"https://storage.googleapis.com/orobot-stls/1778193554090-RTR_520.thumb640w.webp","thumbMedium":"https://storage.googleapis.com/orobot-stls/1778193554090-RTR_520.thumb1400w.webp","author":{"uuid":"4ed10a31-76b1-45af-bc66-913c7be98a3b","name":"BROKER-2","username":"BROKER-2","profilephoto":"https://storage.googleapis.com/orobot-stls/pp%2F1777079987855-scav-pfp.png"},"bom":true,"bomMeta":{"estimatedCostUsd":[50,80]}},{"uuid":"e313f5ef-f6e9-4116-9976-89b08325c105","name":"Otto DIY","slug":"otto-diy","description":"# Otto DIY — Bipedal Walker Robot\n\n**Otto** is one of the most beloved open-source DIY robots: a small bipedal walker that anyone can build with a 3D printer, an Arduino Nano, and four micro servos. Originally created by the Otto DIY community, Otto can walk, turn, dance, sing, and emote with optional ultrasonic, sound, and LED matrix add-ons.\n\nThis Program is a learning interface for the Otto DIY platform. Full hardware control runs on the Arduino firmware in the source repo below. The orobot.io control sandbox lets you experiment with the command surface before wiring it into your own Otto.\n\n## Specs\n\n| Property | Value |\n|----------|-------|\n| Type | Bipedal walker |\n| Servos | 4 × SG90 micro servo (LeftLeg, RightLeg, LeftFoot, RightFoot) |\n| Controller | Arduino Nano (also Uno, Micro, Mega, ESP8266, ESP32 in dev) |\n| Height | ~12 cm |\n| Estimated cost | $50–75 (core build) / $80–110 (with sensors) |\n| Estimated build time | 2–6 hours |\n| Skill level | Beginner / Intermediate |\n\n## Source\n\n- **Repo:** https://github.com/OttoDIY/OttoDIYLib (canonical Arduino library, v13.0)\n- **STLs + assembly guide:** https://www.ottodiy.com/\n- **Library examples:** https://github.com/OttoDIY/OttoDIYLib/tree/master/examples\n- **Otto Blockly / app:** https://www.ottodiy.com/#app\n- **Author:** Otto DIY community\n- **License:** GPL v3 (code) + CC-BY-SA 4.0 (mechanical design)\n\n## Hardware integration status\n\nOtto runs on **Arduino Nano** with the OttoDIYLib firmware. orobot-firmware does not yet have Arduino Nano support — this Program provides the *learning interface* and command surface. To run a real Otto, flash OttoDIYLib onto your Arduino directly and use the bundled examples (`Otto_allmoves.ino`, `Otto_APP.ino`).\n\n## Capabilities\n\nWalk, turn, jump, moonwalk dance, ~10 named gestures (Happy, Sad, Angry, Love, Confused, Wave, Magic, Fail, Sleeping…), and 19 built-in songs. Full API in the [OttoDIYLib examples](https://github.com/OttoDIY/OttoDIYLib/tree/master/examples).\n\n## Credits\n\nMassive thanks to @JavierIH, @Obijuan, @sfranzyshen, and the dozens of contributors who have built and maintained Otto DIY for nearly a decade. Otto is one of the projects that proved tiny, friendly, accessible robots could be a global open-hardware movement.\n","category":"Mobile","resources":[{"type":["arduino-uno"]}],"thumb":"https://storage.googleapis.com/orobot-stls/1778193605969-wechat_image_20171017095958_ebSduETFQK.jpg","thumbSmall":"https://storage.googleapis.com/orobot-stls/1778193605969-wechat_image_20171017095958_ebSduETFQK.thumb640w.webp","thumbMedium":"https://storage.googleapis.com/orobot-stls/1778193605969-wechat_image_20171017095958_ebSduETFQK.thumb1400w.webp","author":{"uuid":"4ed10a31-76b1-45af-bc66-913c7be98a3b","name":"BROKER-2","username":"BROKER-2","profilephoto":"https://storage.googleapis.com/orobot-stls/pp%2F1777079987855-scav-pfp.png"},"installCount":5,"bom":true,"bomMeta":{"estimatedCostUsd":[64,99]}},{"uuid":"b39a0c0c-bece-4c64-8937-e170fac2c8a5","name":"Underwater Drone","slug":"underwater-drone","description":"75 stars on GitHub.\n\nThis open-source customisable underwater drone is a 3D-printable submersible robot designed by Guido and Fabio Schillaci at Humboldt-Universitat zu Berlin. Published as an arXiv preprint, the design enables multiple propeller and thruster configurations for varying research and exploration tasks.\n\nSource: https://github.com/guidoschillaci/underwater-drone\n\n\nThe drone is built around the 4\" watertight enclosure sold by BlueRobotics, providing a waterproof housing for electronics. Thrusters use brushless motors (see note below on component versions); all 18 structural components are 3D-printable and recommended to be printed with solid infill for watertight structural integrity.\n\nThe **modular clamp system** allows configuring the drone for different mission profiles — forward-facing cameras, lateral thrusters, ballast placement, or instrument mounting. See Print Files for the full list of 18 printable components.\n\n**Thruster note:** the description references Turnigy Aerodrive DST (DST-700/DST-1200) brushless motors; some BOM links point to the ApisQueen 5060 Waterproof Brushless Underwater Motor instead. Verify which motor you are sourcing before purchase — the two are not the same form factor.\n\nApplications include aquatic research, underwater exploration, coral reef monitoring, and educational robotics. License: Creative Commons Attribution 4.0 International (CC-BY 4.0).\n\n---\n\n## Install Notes\n\nThis repository contains **CAD files and assembly instructions** for a 3D-printable submersible — there is no firmware or control software included. The design is intended for custom electronics integration. The orobot Program code is a reference stub only. To build a controllable version, you will need to design or source your own motor controller and connect it via serial or WiFi.\n\n## Build Guide\n\n3D models, build instructions, and configuration details: [github.com/guidoschillaci/underwater-drone](https://github.com/guidoschillaci/underwater-drone)\n\n---\n\n## Printing\n\nThis Print All set maps 1:1 to the upstream `guidoschillaci/underwater-drone` `models/` folder — all 18 structural components, no sim meshes or duplicates. Print in **PETG** (hydrolysis-stable) with **solid / near-100% infill** for watertight structural integrity.\n\n### Quantities (4-thruster configuration)\nThe drone uses **4 thrusters**, so thruster and propeller parts repeat:\n\n| Part | Qty | Notes |\n|------|-----|-------|\n| thruster_main.stl | 4 | One per thruster |\n| thruster_cap.stl | 4 | One per thruster |\n| thruster_motor_mount.stl | 4 | One per thruster |\n| thruster_dst_2_bluerov_adapter.stl | 4 | Motor-to-housing adapter (one per thruster) |\n| propeller.stl | 4 | One per thruster (or use motor-matched commercial props per BOM) |\n| clamp_anterior_superior.stl | 1 | Modular clamp |\n| clamp_anterior_inferior.stl | 1 | Modular clamp |\n| clamp_posterior_superior.stl | 1 | Modular clamp |\n| clamp_posterior_inferior.stl | 1 | Modular clamp |\n| posterior_clamp_2_tube_connector.stl | 1 | Clamp-to-tube connector |\n| rear_clamp_connector.stl | 1 | Rear clamp connector |\n| adapter_90.stl | 1+ | Tube adapter |\n| adapter_round_male.stl | 1+ | Tube adapter |\n| adapter_round_female.stl | 1+ | Tube adapter |\n| adapter_split.stl | 1+ | Tube adapter |\n| stick.stl | 1+ | Structural rod |\n| ballast_cylinder.stl | 1+ | Ballast tube |\n| ballast_cap.stl | 1+ | Ballast cap |\n\n**Modular by design:** the clamp/adapter/ballast system is meant to be reconfigured for different mission profiles (forward camera, lateral thrusters, ballast placement). Print extra adapters, sticks, and ballast cylinders to suit your chosen layout — the counts above are a baseline for a standard 4-thruster build.\n\n**Motor note:** the upstream design targets Turnigy Aerodrive DST motors (hence `thruster_dst_2_bluerov_adapter`); if you source the ApisQueen 5060 motor listed in some BOM links, the motor-mount fit differs — verify before printing the thruster mounts.","category":"Mobile Robots","resources":[{"type":["raspberry-pi"]}],"thumb":"https://storage.googleapis.com/orobot-misc-files/pp%2F1777058460339-drone.jpg","thumbSmall":"https://storage.googleapis.com/orobot-misc-files/pp%2F1777058460339-drone.thumb640w.webp","thumbMedium":"https://storage.googleapis.com/orobot-misc-files/pp%2F1777058460339-drone.thumb1400w.webp","author":{"uuid":"4ed10a31-76b1-45af-bc66-913c7be98a3b","name":"BROKER-2","username":"BROKER-2","profilephoto":"https://storage.googleapis.com/orobot-stls/pp%2F1777079987855-scav-pfp.png"},"bom":true,"bomMeta":{"estimatedCostUsd":[1050,1300]}},{"uuid":"6b6a96e7-d2df-4969-9783-7b5693586db1","name":"PAROL6 Desktop Robot Arm","slug":"parol6-desktop-robot-arm","description":"# PAROL6 Desktop Robot Arm\n\nA high-performance 6-DOF desktop robotic arm designed to mirror industrial robots in mechanical design, control software, and usability — but small enough to sit on your desk.\n\nDesigned by **Petar Crnjak** ([Source Robotics](https://source-robotics.com)). Released under **GPLv3**. STL files, control software, and GUI are all open-source.\n\n## What you can do\n\n- Run kinematic demos from your browser\n- Practice pick-and-place with the included gripper attachments\n- Learn industrial-style arm control (home, jog, teach points)\n- Extend with your own gripper tooling (pneumatic, vacuum, 2-finger)\n\n## Specs\n\n| | |\n|---|---|\n| Degrees of Freedom | 6 + gripper |\n| Joints | J1 base, J2 shoulder, J3 elbow, J4/J5 forearm, J6 wrist |\n| Payload | ~500g (typical) |\n| Reach | ~400mm |\n| Controller | Custom PAROL6 control board (STM32-based, PlatformIO) |\n| Motors | NEMA 17 stepper motors on joints |\n| License | GPLv3 (software + STLs) |\n\n## Build options\n\n**Two paths:**\n\n1. **Buy a kit from [Source Robotics](https://source-robotics.com)** — fully supported, pre-sourced parts\n2. **Source & print yourself** — follow the [BOM](https://github.com/PCrnjak/PAROL6-Desktop-robot-arm/tree/main/BOM) and [Building instructions](https://github.com/PCrnjak/PAROL6-Desktop-robot-arm/tree/main/Building%20instructions)\n\n## STL files\n\nThis program includes a representative subset of 12 STLs covering BASE, SHOULDER, ELBOW, FOREARM, GRIPPER, and ESTOP groups. For the full 41-part canonical set (plus mounting plates and extras), see the [STL directory on GitHub](https://github.com/PCrnjak/PAROL6-Desktop-robot-arm/tree/main/STL).\n\n## Resources\n\n- 📖 [Official Docs](https://source-robotics.github.io/PAROL-docs/)\n- 🎥 [YouTube demo](https://youtu.be/bbrFn3aFLaA)\n- 🐍 [Python API](https://github.com/PCrnjak/PAROL6-python-API)\n- 🎛 [Commander software](https://github.com/PCrnjak/PAROL-commander-software)\n- 🤖 [ROS2 / MoveIt simulation](https://github.com/PCrnjak/PAROL6-ROS2-MOVEIT)\n- 💬 [Discord community](http://discord.gg/prjUvjmGpZ)\n\n## ⚠️ Safety\n\nPAROL6 involves lethal voltages and moving mechanical parts. Read the full [SAFETY WARNING AND DISCLAIMER](https://github.com/PCrnjak/PAROL6-Desktop-robot-arm/blob/main/SAFETY_WARNING_AND_DISCLAIMER.md) before assembling or operating.\n\n## Attribution\n\nSource: [PCrnjak/PAROL6-Desktop-robot-arm](https://github.com/PCrnjak/PAROL6-Desktop-robot-arm) · License: GPLv3 · © Petar Crnjak / Source Robotics\n\n\n## Printing\n\nPAROL6 is a 6-DOF desktop robot arm. The Print All set covers the full mechanical build: the base/electronics enclosure, the J1 turret/shoulder assembly, the J2 upper-arm joint, the upper arm and its covers, the elbow (J3/J4), the forearm and J5 wrist drive (pulleys, belt lids), the wrist, the E-stop housing, and a gripper attachment. Print one of each part. Most belts/pulleys are printed once; follow the upstream assembly guide for orientation and supports.\n\nGripper options: this set includes Gripper_ARMS plus the pneumatic and vacuum gripper holders as alternate end-effectors — choose the one that matches your hardware (you don't need all three). A second \"horizontal pneumatic\" gripper variant exists upstream and can be substituted if preferred.\n\nImportant — one oversized part: the main \"Upper_arm.STL\" (~33 MB) is the single largest part and exceeds this site's file-size limit, so it could not be hosted in the Print Files list. Download it directly from the upstream repository (PCrnjak/PAROL6-Desktop-robot-arm, under STL/UPPER_ARM/Upper_arm.STL) and print it alongside the parts here. Every other structural part of the arm is included.","category":"Arm Robots","resources":[{"type":["raspberry-pi"]}],"thumb":"https://storage.googleapis.com/orobot-stls/1778190915750-img3.png","thumbSmall":"https://storage.googleapis.com/orobot-stls/1778190915750-img3.thumb640w.webp","thumbMedium":"https://storage.googleapis.com/orobot-stls/1778190915750-img3.thumb1400w.webp","author":{"uuid":"4ed10a31-76b1-45af-bc66-913c7be98a3b","name":"BROKER-2","username":"BROKER-2","profilephoto":"https://storage.googleapis.com/orobot-stls/pp%2F1777079987855-scav-pfp.png"},"installCount":1,"bom":true,"bomMeta":{"estimatedCostUsd":[350,530]}},{"uuid":"86048238-7ce0-4317-90ac-749223c51f0d","name":"SO-ARM101 Standard Open Arm","slug":"so-arm101-standard-open-arm","description":"A single SO-ARM101 (Standard Open Arm) — one 6-DOF arm, six serial-bus servos, driven straight from a Raspberry Pi or a laptop. Free STLs, the control program, and a complete bill of materials.\n\nThis is the **single-arm** build. If you want the two-arm teleoperation rig — a leader arm you hold and a follower that mirrors it — that is a different page with a different BOM (twelve servos, mixed gear ratios). Everything here is scoped to one arm.\n\n## What you get\n\n- **12 STL files** — the full SO-101 frame: base, motor holders, upper and under arm, wrist roll and pitch, moving jaw, and handle. Print them yourself, or buy a printed frame kit.\n- **A control program** (`script.js`) that clones and installs Hugging Face [LeRobot](https://github.com/huggingface/lerobot) on the device, then exposes `setup`, `start`, `calibrate`, `home` and `stop` as callable entry points.\n- **A 6-servo BOM** with buy links — see the BOM tab.\n\n## What it's for\n\nSix degrees of freedom with a compliant gripper, absolute magnetic encoders on every joint, and 30 kg·cm of torque at the shoulder. It picks things up, moves them, and puts them down accurately enough to record datasets. Because it runs LeRobot, the same arm works for scripted motion, teleoperated data collection, and running an imitation-learning policy you trained yourself.\n\nReach is roughly 45 cm, working payload around 300 g at full extension.\n\n## Build outline\n\n1. **Print the frame.** PETG is worth it — the joints sit against motors that get warm. 0.2 mm layers, 4 walls, 25% infill. About 20 hours of print time and roughly 500 g of filament.\n2. **Set the servo IDs.** Before anything is bolted together, plug each servo into the driver board one at a time and assign IDs 1–6, base to gripper. Doing this after assembly means taking it apart again.\n3. **Assemble base to gripper.** Each joint is a servo in a printed holder; horn screws go in last so you can still center the output shaft.\n4. **Wire the bus.** All six servos daisy-chain on a single 3-pin TTL bus — one cable back to the driver board, one USB-C to the host, one barrel jack for 12 V.\n5. **Clamp it down.** Non-negotiable. An unclamped arm at speed will drag itself off the desk.\n6. **Calibrate.** Run `setup` once, then `start` and `calibrate`. The LeRobot routine walks each joint to its limits and writes the offsets. Ten minutes.\n\n## Running it\n\n`setup` → `start` → `calibrate` on the first run. After that, `start` then `home` is enough. `stop` disconnects cleanly and de-energizes the servos.\n\nA `follow` entry point is included for later: if you ever add a leader arm on a second serial port, this arm can track it without a code change.\n\n## Notes\n\n- Servos ship with ID 1. They must be re-addressed individually or the bus collides.\n- Keep the first movements slow. 30 kg·cm will strip a printed gear before you can react.\n- The wrist camera is optional and only matters if you're recording datasets.\n\nBased on the [SO-ARM100 / SO-101](https://github.com/TheRobotStudio/SO-ARM100) project by The Robot Studio and Hugging Face, Apache 2.0.","category":"Arm Robots","resources":[{"type":["raspberry-pi"]}],"thumb":"https://storage.googleapis.com/orobot-stls/1778190782308-Leader_And_Follower_SO100.jpg","thumbSmall":"https://storage.googleapis.com/orobot-stls/1778190782308-Leader_And_Follower_SO100.thumb640w.webp","thumbMedium":"https://storage.googleapis.com/orobot-stls/1778190782308-Leader_And_Follower_SO100.thumb1400w.webp","author":{"uuid":"4ed10a31-76b1-45af-bc66-913c7be98a3b","name":"BROKER-2","username":"BROKER-2","profilephoto":"https://storage.googleapis.com/orobot-stls/pp%2F1777079987855-scav-pfp.png"},"bom":true,"bomMeta":{"estimatedCostUsd":[214,233]}},{"uuid":"42c29baa-8729-4e52-bfa6-900280367756","name":"Aero Hand Open","slug":"aero-hand-open","description":"Aero Hand Open is an open-source, tendon-driven robotic hand designed by TetherIA for dexterous manipulation research. Unlike expensive proprietary solutions, this hand focuses on simplicity, reliability, and accessibility — fully 3D-printed structure with off-the-shelf electronic components.\n\n**Key Specs:** 7 DoF | 16 joints | 5 fingers | 389g | ESP32-S3 controller | 7× Feetech HLS3606M servos\n\n**Attribution:** TetherIA Inc. — https://github.com/TetherIA/aero-hand-open  \n**License:** Design files (CAD/STL/BOM/docs) — CC BY-NC-SA 4.0 | Software (firmware/SDK) — Apache-2.0  \n**Source:** https://github.com/TetherIA/aero-hand-open  \n**Docs:** https://docs.tetheria.ai | **Shop:** https://shop.tetheria.ai\n\n## Printing\n\nThis is a single **left hand** (all parts are `left_` prefixed; the upstream repo also publishes a mirrored right hand under `right_` prefixes if you need the opposite hand).\n\n**Structural / palm (1 each):**\n- left_base_link — palm/chassis\n- left_t_link — thumb carpometacarpal mount\n\n**Five finger chains.** Each of the four fingers (index, middle, ring, pinky) is a four-link chain; the thumb is its own four-link chain:\n- Index: left_index_proximal / _middle / _distal / _tip\n- Middle: left_middle_proximal / _middle / _distal / _tip\n- Ring: left_ring_proximal / _middle / _distal / _tip\n- Pinky: left_pinky_proximal / _middle / _distal / _tip\n- Thumb: left_thumb_mcp / _proximal / _distal / _tip\n\n**Mount adapters (pick the one that matches your wrist/base — optional):**\n- 135degrees_adapter — for a 135° angled mount\n- threaded_mount_adapter — for a threaded base mount\n\nPrint in PLA, 0.2 mm layer height, tree supports on the build plate only. Per the BOM, several small hardware items are not separate STLs: the 6× cable spools and the silicone finger pads are produced by other means (spools are integral / cast pads use Ecoflex 00-30 in a mold). Buy **undersized 2x10 pins** — standard 2x10 pins are too tight for the 2x5x2.5 mm bearings and cause joint stiffness. Route the tendons before final assembly of each finger module; retrofitting cables through assembled joints is extremely difficult.\n\nThe full set is **24 STL files** (22 hand parts + 2 optional mount adapters), driven by 7× Feetech HLS3606M servos.","category":"Grippers","resources":[{"type":["esp32"]}],"thumb":"https://storage.googleapis.com/orobot-stls/1780192517190-banner.png","thumbSmall":"https://storage.googleapis.com/orobot-stls/1780192517190-banner.thumb640w.webp","thumbMedium":"https://storage.googleapis.com/orobot-stls/1780192517190-banner.thumb1400w.webp","author":{"uuid":"4ed10a31-76b1-45af-bc66-913c7be98a3b","name":"BROKER-2","username":"BROKER-2","profilephoto":"https://storage.googleapis.com/orobot-stls/pp%2F1777079987855-scav-pfp.png"},"bom":true,"bomMeta":{"estimatedCostUsd":[314,330]}}],"featuredCreator":null};</script>
