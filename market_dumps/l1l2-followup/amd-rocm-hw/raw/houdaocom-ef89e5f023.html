hitecture, with approximately 40 compute units, responsible for vision processing, sensor data fusion, and large-scale AI model inference.\u003C\/li\u003E\n\u003Cli\u003E\u003Cstrong\u003ENPU\u003C\/strong\u003E: An integrated Neural Processing Unit with the XDNA 2 architecture, dedicated to efficiently executing low-power, continuously running AI tasks.\u003C\/li\u003E\u003C\/ul\u003E\n\n\u003Cp\u003EThese three engines share data through a unified memory architecture, significantly reducing the latency and power consumption of data migration between different compute units. Its flagship model, the X199, is claimed to deliver approximately \u003Cstrong\u003E60 TFLOPS\u003C\/strong\u003E of FP16 GPU compute and about \u003Cstrong\u003E50 TOPS\u003C\/strong\u003E of NPU compute. The series also features industrial-grade reliability, with an operating junction temperature range of -40\u00b0C to 105\u00b0C and support for up to \u003Cstrong\u003E10 years\u003C\/strong\u003E of 24\/7 continuous operation.\u003C\/p\u003E\n\n\u003Cp\u003EHowever, the X100 SoC is only part of the solution. The true innovation of the Kria platform lies in integrating the X100 with a \u003Cstrong\u003ESpartan UltraScale+ FPGA\u003C\/strong\u003E (Field-Programmable Gate Array) on the same board, forming a complete system where the \u201cbrain\u201d (SoC) and \u201cspinal cord\u201d (FPGA) work in synergy.\u003C\/p\u003E\n\n\u003Ch2\u003EThe Role of the FPGA: Tackling the \u2018Determinism\u2019 Challenge in Robot Control\u003C\/h2\u003E\n\n\u003Cp\u003EModern robotic systems have three layers of computational needs: top-level \u2018perception and inference\u2019, mid-level \u2018planning\u2019, and bottom-level \u2018real-time control\u2019. While GPUs and NPUs excel at the first two, the core requirement for real-time control is not just speed, but being \u2018on time\u2019\u2014also known as \u003Cstrong\u003EDeterminism\u003C\/strong\u003E.\u003C\/p\u003E\n\n\u003Cp\u003EControl commands must be delivered to motor drivers within a strictly fixed time cycle (typically in microseconds). Any slight delay or jitter can cause the robot\u2019s movements to become unstable or even lead to a fall. Traditional CPU\/GPU systems, based on time-sharing scheduling, struggle to provide this hardware-level timing guarantee. This is precisely where the FPGA comes in.\u003C\/p\u003E\n\n\u003Cp\u003EAs a reconfigurable hardware logic circuit, an FPGA can execute parallel tasks with extremely low, fixed latency. In the Kria platform, the FPGA is used as a \u003Cstrong\u003Edeterministic real-time coprocessor\u003C\/strong\u003E, specifically responsible for:\u003C\/p\u003E\n\n\u003Cul\u003E\u003Cli\u003E\u003Cstrong\u003EHigh-frequency closed-loop control\u003C\/strong\u003E: Directly managing the motion control loops for all joint motors and actuators.\u003C\/li\u003E\n\u003Cli\u003E\u003Cstrong\u003ESensor I\/O\u003C\/strong\u003E: Processing data streams from low-level sensors such as IMUs, encoders, and torque sensors.\u003C\/li\u003E\n\u003Cli\u003E\u003Cstrong\u003ESafety functions\u003C\/strong\u003E: Executing hardware-level safety interlocks and emergency stop logic.\u003C\/li\u003E\u003C\/ul\u003E\n\n\u003Cp\u003EBy placing the FPGA and the main SoC on the same board with high-speed interconnects, AMD bridges the gap from high-level AI decisions to low-level motor execution, eliminating the communication bottlenecks present in traditional multi-board solutions.\u003C\/p\u003E\n\n\u003Ch2\u003EDecoding the Benchmarks: The Fine Print Behind the 3.4x Advantage\u003C\/h2\u003E\n\n\u003Cp\u003EIn its announcement, AMD cited test data from the \u003Cstrong\u003EOpenNav Robotics Workload Benchmark\u003C\/strong\u003E, claiming its platform achieves up to \u003Cstrong\u003E3.4 times\u003C\/strong\u003E the real-time reliability (ability to complete control loops on time), supports approximately \u003Cstrong\u003E2.3 times\u003C\/strong\u003E the number of concurrent y is not just a technological competition but also a strategic play. Its core strategy is \u003Cstrong\u003Eopenness and integration\u003C\/strong\u003E.\u003C\/p\u003E\n\n\u003Cp\u003EOn the hardware front, the Kria platform adopts the \u003Cstrong\u003ECOM-HPC\u003C\/strong\u003E open standard for modules. This allows robot manufacturers to switch between compute modules from different vendors without redesigning expensive carrier boards, reducing development costs and supply chain risks. This strategy aims to break the ecosystem lock-in created by Nvidia\u2019s proprietary Jetson form factor.\u003C\/p\u003E\n\n\u003Cp\u003EOn the software front, AMD is actively building an open robotics partner network around the \u003Cstrong\u003EROCm\u003C\/strong\u003E compute platform, \u003Cstrong\u003EROS 2\u003C\/strong\u003E (Robot Operating System), and the \u003Cstrong\u003EMoveIt\u003C\/strong\u003E motion planning library. It is collaborating with vendors in simulation, sensing, and safety to create an alternative to NVIDIA\u2019s Isaac ecosystem.\u003C\/p\u003E\n\n\u003Cp\u003EDuring the announcement, several companies were named as early adopters:\u003C\/p\u003E\n\n\u003Cul\u003E\u003Cli\u003E\u003Cstrong\u003EFoundation Future Industries\u003C\/strong\u003E: The San Francisco-based humanoid robotics company announced that its Phantom series robots will fully adopt the X100 platform. The company specifically highlighted its plan to use the FPGA to drive its \u003Cstrong\u003E23-DoF\u003C\/strong\u003E dexterous hand, enabling high-frequency haptic feedback and precise control.\u003C\/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EGenerative Bionics\u003C\/strong\u003E: This Italian startup\u2019s GENE.01 humanoid robot also uses the AMD solution and has received investment from AMD. Its philosophy is \u201cthe body as compute,\u201d emphasizing the distributed implementation of computing power throughout the robot\u2019s body.\u003C\/li\u003E\u003C\/ul\u003E\n\n\u003Cp\u003E\u003Cimg src=\"https:\/\/image.houdao.com\/2026-08-02\/1785657752-471508.jpg\" title=\"\" alt=\"\"\u003E\u003C\/p\u003E\n\n\u003Cp\u003EAMD\u2019s solution aims to consolidate the separate \u003Cstrong\u003EIndustrial PC (for real-time control)\u003C\/strong\u003E and \u003Cstrong\u003EAI compute box (for vision and AI)\u003C\/strong\u003E common in past robotic systems into a single platform, thereby reducing system complexity, cost, and power consumption. This \u201cinvisible benefit of integration\u201d will be key to convincing customers.\u003C\/p\u003E\n\n\u003Cp\u003EAMD\u2019s entry marks the transition of the robot \u201cbrain\u201d chip market from a \u2018monologue\u2019 era to a \u2018dialogue\u2019 era\u2014a conversation between heterogeneous and unified architectures, and between open and closed ecosystems. The outcome of this competition will be determined by product delivery, software maturity, and ecosystem growth in the coming quarters.\u003C\/p\u003E","dateCreated":"2026-08-02T08:04:43+00:00","author":{"@type":"Person","name":"Lunardream"},"answerCount":0}},{"@context":"http:\/\/schema.org","@type":"BreadcrumbList","itemListElement":{"@type":"ListItem","name":"Robotics","item":"https:\/\/www.houdao.com\/t\/AI-Robotics","position":2}},{"@context":"http:\/\/schema.org","@type":"WebSite","url":"https:\/\/www.houdao.com\/","potentialAction":{"@type":"SearchAction","target":"https:\/\/www.houdao.com\/?q={search_term_string}","query-input":"required name=search_term_string"}}]</script>

    <h1>AMD Challenges Nvidia Jetson with Ryzen AI Embedded X100 and Kria Robotics Platform</h1>

    <div>
                    <article>
                                <div class="PostUser"><h3 class="PostUser-name">Lunardream</h3></div>
                <div class="Post-body">
                    <h1>A Four-in-One Heterogeneous Computing Core: The Kria Robotics Development Platform</h1>

<p>At the Advancing AI 2026 conference on July 23, 2026, AMD officially unveiled the core of its robotics strategy—the Kria AI Robotics Development Platform. At the heart of this platform is the <strong>Ryzen AI Embedded X100 series processor</strong>, a heterogeneous System-on-Chip (SoC) designed specifically for robotics applications.</p>

<p>The Ryzen AI Embedded X100 integrates three major compute engines in a single package:</p>

<ul><li><strong>CPU</strong>: Up to 16 Zen 5 architecture cores for handling high-level task planning, operating system scheduling, and middleware like ROS 2.</li>
<li><strong>GPU</strong>: An integrated GPU based on the RDNA 3.5 architecture, with approximately 40 compute units, responsible for vision processing, sensor data fusion, and large-scale AI model inference.</li>
<li><strong>NPU</strong>: An integrated Neural Processing Unit with the XDNA 2 architecture, dedicated to efficiently executing low-power, continuously running AI tasks.</li></ul>

<p>These three engines share data through a unified memory architecture, significantly reducing the latency and power consumption of data migration between different compute units. Its flagship model, the X199, is claimed to deliver approximately <strong>60 TFLOPS</strong> of FP16 GPU compute and about <strong>50 TOPS</strong> of NPU compute. The series also features industrial-grade reliability, with an operating junction temperature range of -40°C to 105°C and support for up to <strong>10 years</strong> of 24/7 continuous operation.</p>

<p>However, the X100 SoC is only part of the solution. The true innovation of the Kria platform lies in integrating the X100 with a <strong>Spartan UltraScale+ FPGA</strong> (Field-Programmable Gate Array) on the same board, forming a complete system where the “brain” (SoC) and “spinal cord” (FPGA) work in synergy.</p>

<h2>The Role of the FPGA: Tackling the ‘Determinism’ Challenge in Robot Control</h2>

<p>Modern robotic systems have three layers of computational needs: top-level ‘perception and inference’, mid-level ‘planning’, and bottom-level ‘real-time control’. While GPUs and NPUs excel at the first two, the core requirement for real-time control is not just speed, but being ‘on time’—also known as <strong>Determinism</strong>.</p>

<p>Control commands must be delivered to motor drivers within a strictly fixed time cycle (typically in microseconds). Any slight delay or jitter can cause the robot’s movements to become unstable or even lead to a fall. Traditional CPU/GPU systems, based on time-sharing scheduling, struggle to provide this hardware-level timing guarantee. This is precisely where the FPGA comes in.</p>

<p>As a reconfigurable hardware logic circuit, an FPGA can execute parallel tasks with extremely low, fixed latency. In the Kria platform, the FPGA is used as a <strong>deterministic real-time coprocessor</strong>, specifically responsible for:</p>

<ul><li><strong>High-frequency closed-loop control</strong>: Directly managing the motion control loops for all joint motors and actuators.</li>
<li><strong>Sensor I/O</strong>: Processing data streams from low-level sensors such as IMUs, encoders, and torque sensors.</li>
<li><strong>Safety functions</strong>: Executing hardware-level safety interlocks and emergency stop logic.</li></ul>

<p>By placing the FPGA and the main SoC on the same board with high-speed interconnects, AMD bridges the gap from high-level AI decisions to low-level motor execution, eliminating the communication bottlenecks present in traditional multi-board solutions.</p>

<h2>Decoding the Benchmarks: The Fine Print Behind the 3.4x Advantage</h2>

<p>In its announcement, AMD cited test data from the <strong>OpenNav Robotics Workload Benchmark</strong>, claiming its platform achieves up to <strong>3.4 times</strong> the real-time reliability (ability to complete control loops on time), supports approximately <strong>2.3 times</strong> the number of concurrent agents, and retains about <strong>1.6 times</strong> more idle CPU resources compared to Nvidia’s Jetson Thor T5000 in a specific robotics workload.</p>

<p>These figures require careful interpretation. The benchmark scenario involves an autonomous forklift operating in a large warehouse, simultaneously processing multi-sensor data, running the Nav2 navigation stack, and a visual language model. The conclusion primarily indicates that, under full load, AMD’s x86 CPU architecture and FPGA combination provides more headroom for ensuring the determinism of control loops.</p>

<p>However, the test report itself includes important notes:</p>

<ul><li><strong>Software Ecosystem</strong>: The report acknowledges that Nvidia still holds a significant advantage in its robotics-specific software stack, including <strong>Isaac Sim</strong> for simulation and <strong>Isaac Lab</strong> for reinforcement learning training. AMD’s ROCm ecosystem has yet to achieve feature parity.</li>
<li><strong>Test Hardware</strong>: Since the X100 series was not in mass production at the time of testing, the benchmarks were run using a consumer-grade Ryzen AI Max+ 395 processor with similar specifications as a proxy. The final product’s actual performance will need to be verified after mass production begins in Q4 2026.</li></ul>

<p>Therefore, a more accurate statement is that AMD’s new architecture shows potential in real-time control aspects in a specific full-stack robotics benchmark. This does not equate to a comprehensive lead in AI inference performance, nor does it mean its development ecosystem is fully mature.</p>

<h2>Market Strategy and Early Adopters</h2>

<p>AMD’s entry is not just a technological competition but also a strategic play. Its core strategy is <strong>openness and integration</strong>.</p>

<p>On the hardware front, the Kria platform adopts the <strong>COM-HPC</strong> open standard for modules. This allows robot manufacturers to switch between compute modules from different vendors without redesigning expensive carrier boards, reducing development costs and supply chain risks. This strategy aims to break the ecosystem lock-in created by Nvidia’s proprietary Jetson form factor.</p>

<p>On the software front, AMD is actively building an open robotics partner network around the <strong>ROCm</strong> compute platform, <strong>ROS 2</strong> (Robot Operating System), and the <strong>MoveIt</strong> motion planning library. It is collaborating with vendors in simulation, sensing, and safety to create an alternative to NVIDIA’s Isaac ecosystem.</p>

<p>During the announcement, several companies were named as early adopters:</p>

<ul><li><strong>Foundation Future Industries</strong>: The San Francisco-based humanoid robotics company announced that its Phantom series robots will fully adopt the X100 platform. The company specifically highlighted its plan to use the FPGA to drive its <strong>23-DoF</strong> dexterous hand, enabling high-frequency haptic feedback and precise control.</li>
<li><strong>Generative Bionics</strong>: This Italian startup’s GENE.01 humanoid robot also uses the AMD solution and has received investment from AMD. Its philosophy is “the body as compute,” emphasizing the distributed implementation of computing power throughout the robot’s body.</li></ul>

<p><img src="https://image.houdao.com/2026-08-02/1785657752-471508.jpg" title="" alt=""></p>

<p>AMD’s solution aims to consolidate the separate <strong>Industrial PC (for real-time control)</strong> and <strong>AI compute box (for vision and AI)</strong> common in past robotic systems into a single platform, thereby reducing system complexity, cost, and power consumption. This “invisible benefit of integration” will be key to convincing customers.</p>

<p>AMD’s entry marks the transition of the robot “brain” chip market from a ‘monologue’ era to a ‘dialogue’ era—a conversation between heterogeneous and unified architectures, and between open and closed ecosystems. The outcome of this competition will be determined by product delivery, software maturity, and ecosystem growth in the coming quarters.</p>

alse,"canEditGroupRecipients":false,"isPrivateDiscussion":false,"canReset":false,"viewCount":2,"canViewNumber":true,"hasPoll":false,"canStartPoll":false,"canSelectBestAnswer":false,"isSticky":false,"canSticky":false,"isLocked":false,"canLock":false,"bookmarked":false},"relationships":{"user":{"data":{"type":"users","id":"219"}},"posts":{"data":[{"type":"posts","id":"18312"}]},"tags":{"data":[{"type":"tags","id":"12"},{"type":"tags","id":"268"}]},"recipientUsers":{"data":[]},"recipientGroups":{"data":[]},"uniqueViews":{"data":[]},"latestViews":{"data":[{"type":"discussionviews","id":"36481"},{"type":"discussionviews","id":"36234"}]},"catchTheFishFishes":{"data":[]}}},"included":[{"type":"users","id":"219","attributes":{"username":"Lunardream","displayName":"Lunardream","avatarUrl":"https:\/\/www.houdao.com\/assets\/avatars\/219.jpg","slug":"Lunardream","joinTime":"2024-11-07T06:25:34+00:00","discussionCount":348,"commentCount":357,"canEdit":false,"canEditCredentials":false,"canEditGroups":false,"canDelete":false,"lastSeenAt":null,"canSuspend":false,"money":0,"canEditMoney":false,"blocksPd":false,"cannotBeDirectMessaged":false,"lastCheckinTime":null,"totalContinuousCheckIn":0,"checkInCompatibleExtensions":["fof-follow-tags"],"canCheckin":true,"canCheckinContinuous":false,"followed":null,"canBeFollowed":true,"followingCount":0,"followerCount":0,"bio":"","canViewBio":true,"canEditBio":false,"fof-upload-uploadCountCurrent":null,"fof-upload-uploadCountAll":null,"canViewSocialProfile":false,"ignored":false,"canBeIgnored":false,"bestAnswerCount":0,"isBanned":false,"canBanIP":false,"canEditNickname":false},"relationships":{"groups":{"data":[]}}},{"type":"posts","id":"18312","attributes":{"number":0,"createdAt":"2026-08-02T08:04:43+00:00","contentType":"comment","contentHtml":"\u003Ch1\u003EA Four-in-One Heterogeneous Computing Core: The Kria Robotics Development Platform\u003C\/h1\u003E\n\n\u003Cp\u003EAt the Advancing AI 2026 conference on July 23, 2026, AMD officially unveiled the core of its robotics strategy\u2014the Kria AI Robotics Development Platform. At the heart of this platform is the \u003Cstrong\u003ERyzen AI Embedded X100 series processor\u003C\/strong\u003E, a heterogeneous System-on-Chip (SoC) designed specifically for robotics applications.\u003C\/p\u003E\n\n\u003Cp\u003EThe Ryzen AI Embedded X100 integrates three major compute engines in a single package:\u003C\/p\u003E\n\n\u003Cul\u003E\u003Cli\u003E\u003Cstrong\u003ECPU\u003C\/strong\u003E: Up to 16 Zen 5 architecture cores for handling high-level task planning, operating system scheduling, and middleware like ROS 2.\u003C\/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EGPU\u003C\/strong\u003E: An integrated GPU based on the RDNA 3.5 architecture, with approximately 40 compute units, responsible for vision processing, sensor data fusion, and large-scale AI model inference.\u003C\/li\u003E\n\u003Cli\u003E\u003Cstrong\u003ENPU\u003C\/strong\u003E: An integrated Neural Processing Unit with the XDNA 2 architecture, dedicated to efficiently executing low-power, continuously running AI tasks.\u003C\/li\u003E\u003C\/ul\u003E\n\n\u003Cp\u003EThese three engines share data through a unified memory architecture, significantly reducing the latency and power consumption of data migration between different compute units. Its flagship model, the X199, is claimed to deliver approximately \u003Cstrong\u003E60 TFLOPS\u003C\/strong\u003E of FP16 GPU compute and about \u003Cstrong\u003E50 TOPS\u003C\/strong\u003E of NPU compute. The series also features industrial-grade reliability, with an operating junction temperature range of -40\u00b0C to 105\u00b0C and support for up to \u003Cstrong\u003E10 years\u003C\/strong\u003E of 24\/7 continuous operation.\u003C\/p\u003E\n\n\u003Cp\u003EHowever, the X100 SoC is only part of the solution. The true innovation of the Kria platform lies in integrating the X100 with a \u003Cstrong\u003ESpartan UltraScale+ FPGA\u003C\/strong\u003E (Field-Programmable Gate Array) on the same board, forming a complete system where the \u201cbrain\u201d (SoC) and \u201cspinal cord\u201d (FPGA) work in synergy.\u003C\/p\u003E\n\n\u003Ch2\u003EThe Role of the FPGA: Tackling the \u2018Determinism\u2019 Challenge in Robot Control\u003C\/h2\u003E\n\n\u003Cp\u003EModern robotic systems have three layers of computational needs: top-level \u2018perception and inference\u2019, mid-level \u2018planning\u2019, and bottom-level \u2018real-time control\u2019. While GPUs and NPUs excel at the first two, the core requirement for real-time control is not just speed, but being \u2018on time\u2019\u2014also known as \u003Cstrong\u003EDeterminism\u003C\/strong\u003E.\u003C\/p\u003E\n\n\u003Cp\u003EControl commands must be delivered to motor drivers within a strictly fixed time cycle (typically in microseconds). Any slight delay or jitter can cause the robot\u2019s movements to become unstable or even lead to a fall. Traditional CPU\/GPU systems, based on time-sharing scheduling, struggle to provide this hardware-level timing guarantee. This is precisely where the FPGA comes in.\u003C\/p\u003E\n\n\u003Cp\u003EAs a reconfigurable hardware logic circuit, an FPGA can execute parallel tasks with extremely low, fixed latency. In the Kria platform, the FPGA is used as a \u003Cstrong\u003Edeterministic real-time coprocessor\u003C\/strong\u003E, specifically responsible for:\u003C\/p\u003E\n\n\u003Cul\u003E\u003Cli\u003E\u003Cstrong\u003EHigh-frequency closed-loop control\u003C\/strong\u003E: Directly managing the motion control loops for all joint motors and actuators.\u003C\/li\u003E\n\u003Cli\u003E\u003Cstrong\u003ESensor I\/O\u003C\/strong\u003E: Processing data streams from low-level sensors such as IMUs, encoders, and torque sensors.\u003C\/li\u003E\n\u003Cli\u003E\u003Cstrong\u003ESafety functions\u003C\/strong\u003E: Executing hardware-level safety interlocks and emergency stop logic.\u003C\/li\u003E\u003C\/ul\u003E\n\n\u003Cp\u003EBy placing the FPGA and the main SoC on the same board with high-speed interconnects, AMD bridges the gap from high-level AI decisions to low-level motor execution, eliminating the communication bottlenecks present in traditional multi-board solutions.\u003C\/p\u003E\n\n\u003Ch2\u003EDecoding the Benchmarks: The Fine Print Behind the 3.4x Advantage\u003C\/h2\u003E\n\n\u003Cp\u003EIn its announcement, AMD cited test data from the \u003Cstrong\u003EOpenNav Robotics Workload Benchmark\u003C\/strong\u003E, claiming its platform achieves up to \u003Cstrong\u003E3.4 times\u003C\/strong\u003E the real-time reliability (ability to complete control loops on time), supports approximately \u003Cstrong\u003E2.3 times\u003C\/strong\u003E the number of concurrent agents, and retains about \u003Cstrong\u003E1.6 times\u003C\/strong\u003E more idle CPU resources compared to Nvidia\u2019s Jetson Thor T5000 in a specific robotics workload.\u003C\/p\u003E\n\n\u003Cp\u003EThese figures require careful interpretation. The benchmark scenario involves an autonomous forklift operating in a large warehouse, simultaneously processing multi-sensor data, running the Nav2 navigation stack, and a visual language model. The conclusion primarily indicates that, under full load, AMD\u2019s x86 CPU architecture and FPGA combination provides more headroom for ensuring the determinism of control loops.\u003C\/p\u003E\n\n\u003Cp\u003EHowever, the test report itself includes important notes:\u003C\/p\u003E\n\n\u003Cul\u003E\u003Cli\u003E\u003Cstrong\u003ESoftware Ecosystem\u003C\/strong\u003E: The report acknowledges that Nvidia still holds a significant advantage in its robotics-specific software stack, including \u003Cstrong\u003EIsaac Sim\u003C\/strong\u003E for simulation and \u003Cstrong\u003EIsaac Lab\u003C\/strong\u003E for reinforcement learning training. AMD\u2019s ROCm ecosystem has yet to achieve feature parity.\u003C\/li\u003E\n\u003Cli\u003E\u003Cstrong\u003ETest Hardware\u003C\/strong\u003E: Since the X100 series was not in mass production at the time of testing, the benchmarks were run using a consumer-grade Ryzen AI Max+ 395 processor with similar specifications as a proxy. The final product\u2019s actual performance will need to be verified after mass production begins in Q4 2026.\u003C\/li\u003E\u003C\/ul\u003E\n\n\u003Cp\u003ETherefore, a more accurate statement is that AMD\u2019s new architecture shows potential in real-time control aspects in a specific full-stack robotics benchmark. This does not equate to a comprehensive lead in AI inference performance, nor does it mean its development ecosystem is fully mature.\u003C\/p\u003E\n\n\u003Ch2\u003EMarket Strategy and Early Adopters\u003C\/h2\u003E\n\n\u003Cp\u003EAMD\u2019s entry is not just a technological competition but also a strategic play. Its core strategy is \u003Cstrong\u003Eopenness and integration\u003C\/strong\u003E.\u003C\/p\u003E\n\n\u003Cp\u003EOn the hardware front, the Kria platform adopts the \u003Cstrong\u003ECOM-HPC\u003C\/strong\u003E open standard for modules. This allows robot manufacturers to switch between compute modules from different vendors without redesigning expensive carrier boards, reducing development costs and supply chain risks. This strategy aims to break the ecosystem lock-in created by Nvidia\u2019s proprietary Jetson form factor.\u003C\/p\u003E\n\n\u003Cp\u003EOn the software front, AMD is actively building an open robotics partner network around the \u003Cstrong\u003EROCm\u003C\/strong\u003E compute platform, \u003Cstrong\u003EROS 2\u003C\/strong\u003E (Robot Operating System), and the \u003Cstrong\u003EMoveIt\u003C\/strong\u003E motion planning library. It is collaborating with vendors in simulation, sensing, and safety to create an alternative to NVIDIA\u2019s Isaac ecosystem.\u003C\/p\u003E\n\n\u003Cp\u003EDuring the announcement, several companies were named as early adopters:\u003C\/p\u003E\n\n\u003Cul\u003E\u003Cli\u003E\u003Cstrong\u003EFoundation Future Industries\u003C\/strong\u003E: The San Francisco-based humanoid robotics company announced that its Phantom series robots will fully adopt the X100 platform. The company specifically highlighted its plan to use the FPGA to drive its \u003Cstrong\u003E23-DoF\u003C\/strong\u003E dexterous hand, enabling high-frequency haptic feedback and precise control.\u003C\/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EGenerative Bionics\u003C\/strong\u003E: This Italian startup\u2019s GENE.01 humanoid robot also uses the AMD solution and has received investment from AMD. Its philosophy is \u201cthe body as compute,\u201d emphasizing the distributed implementation of computing power throughout the robot\u2019s body.\u003C\/li\u003E\u003C\/ul\u003E\n\n\u003Cp\u003E\u003Cimg src=\u0022https:\/\/image.houdao.com\/2026-08-02\/1785657752-471508.jpg\u0022 title=\u0022\u0022 alt=\u0022\u0022\u003E\u003C\/p\u003E\n\n\u003Cp\u003EAMD\u2019s solution aims to consolidate the separate \u003Cstrong\u003EIndustrial PC (for real-time control)\u003C\/strong\u003E and \u003Cstrong\u003EAI compute box (for vision and AI)\u003C\/strong\u003E common in past robotic systems into a single platform, thereby reducing system complexity, cost, and power consumption. This \u201cinvisible benefit of integration\u201d will be key to convincing customers.\u003C\/p\u003E\n\n\u003Cp\u003EAMD\u2019s entry marks the transition of the robot \u201cbrain\u201d chip market from a \u2018monologue\u2019 era to a \u2018dialogue\u2019 era\u2014a conversation between heterogeneous and unified architectures, and between open and closed ecosystems. The outcome of this competition will be determined by product delivery, software maturity, and ecosystem growth in the coming quarters.\u003C\/p\u003E","renderFailed":false,"canEdit":false,"canDelete":false,"canHide":false,"mentionedByCount":0,"canFlag":false,"isApproved":true,"canApprove":false,"canLike":false,"likesCount":0,"canStartPoll":false,"canBanIP":false,"bookmarked":false},"relations
