te_modal_budget_faq_change_after_launched_title":"Can I change the budget after launching an ad?","video_clip_promote_modal_budget_faq_choose_desc":"The system will suggest a suitable budget based on data about your business, audience, and the competition.\u003cbr\u003e\u003cbr\u003eWe suggest choosing a budget at the same level as the competition or slightly higher to get results faster.\u003cbr\u003e\u003cbr\u003eIf the budget is lower than the competition’s, the system will need more time for learning and finding the right audience.","video_clip_promote_modal_budget_faq_choose_title":"How to select budget","video_clip_promote_modal_budget_faq_influence_desc":"Users will see your ad more often if the system considers it more successful than the competition’s.\u003cbr\u003e\u003cbr\u003eThis is affected by the selected audience, photos and videos in the ad, and the budget.\u003cbr\u003e\u003cbr\u003eTo show your ad to the right audience, choose a budget at the same level as the competition\u0026#39;s or slightly higher.\u003cbr\u003e\u003cbr\u003eIf your budget is lower than the competition’s, the system will need more time to find the right audience.","video_clip_promote_modal_budget_faq_influence_title":"What does the budget choice affect?","video_clip_promote_modal_budget_faq_moderation_reject_desc":"If you’ve already topped up your advertising account, the funds will stay in your account.\u003cbr\u003e\u003cbr\u003eFix the errors and resubmit your ad for moderation.\u003cbr\u003e\u003cbr\u003eYou will be charged once the ad passes moderation and impressions start.","video_clip_promote_modal_budget_faq_moderation_reject_title":"What happens to the money if the ad is rejected?","video_clip_promote_modal_budget_faq_title":"Help","video_clip_promote_modal_budget_faq_written_off_desc":"The advertising account balance is like a wallet. You need to top it up right after launching the ad. While the ad is under moderation, you won’t be charged. Funds will be gradually deducted as the ad is shown.\u003cbr\u003e\u003cbr\u003eThe ad budget is the maximum amount that can be deducted from the account balance for a chosen period, such as per day or for the entire duration.\u003cbr\u003e\u003cbr\u003eYou can stop the ad at any time. Impressions will stop along with the charges.","video_clip_promote_modal_budget_faq_written_off_title":"How is the budget deducted?","video_clip_promote_modal_budget_slider_desc_bad":"Much lower than your competitors. It\u0026#39;ll be hard to find an audience.","video_clip_promote_modal_budget_slider_desc_best":"Significantly higher than your competitors. You can save money at no loss.","video_clip_promote_modal_budget_slider_desc_good":"Higher than your competitors. You have every chance of succeeding.","video_clip_promote_modal_budget_slider_desc_mid":"Same as your competitors. It\u0026#39;s enough to reach your target audience.","video_clip_promote_modal_budget_slider_desc_min":"Lower than your competitors. It may be hard to find an audience.","video_clip_promote_modal_budget_status_faq":"Why?","video_clip_promote_modal_budget_title":"Budget: \u0026#8381;{budget} per day","video_clip_promote_modal_duration_custom_date_title":"Custom end date","video_clip_promote_modal_duration_date_info":"The longer the promotion, the cheaper the ads.","video_clip_promote_modal_duration_date_info_faq":"Why?","video_clip_promote_modal_duration_date_info_faq_desc":"Initially, the system will spend time on learning and finding the right audience.\u003cbr\u003e\u003cbr\u003eThen it will try to get as many target actions as possible at the lowest cost.\u003cbr\u003e\u003cbr\u003eEvery additional day the ad runs compensates for the time spent on learning, making the promotion increasingly cost-effective.\u003cbr\u003e\u003cbr\u003e*How the optimal duration was calculated*\u003cbr\u003eWe analyzed the results of similar campaigns. This period allows the system to finish learning and reach maximum efficiency.\u003cbr\u003e\u003cbr\u003e*Warm-up might take some time*\u003cbr\u003eSometimes people need time to decide on a purchase: from a few hours to several weeks. Publish posts and stories to remind your audience about yourself more often.","video_clip_promote_modal_duration_date_info_faq_title":"Promotion becomes more cost-effective each day","video_clip_promote_modal_duration_date_required":"Required","video_clip_promote_modal_duration_day_recommended":"Recommended","video_clip_promote_modal_duration_day_title":["","{days} day","{days} days"],"video_clip_promote_modal_duration_day_title_after":"until {date}","video_clip_promote_modal_duration_title":"Duration","video_clip_promote_modal_title":"Budget and duration","video_clip_publish":"Post to wall","video_clip_publish_by_group_info":"Your clip will appear in the Clips section and on your community wall","video_clip_publish_date_promote_enabled_info_modal_description":"To change the clip\u0026#39;s posting time, first disable promotion","video_clip_publish_date_promote_enabled_info_modal_title":"You can only promote a clip that\u0026#39;s published right now","video_clip_publish_info":"Your clip will appear in the Clips section and on your wall","video_clip_restriction_claim_short":"Track seized by copyright holder","video_clip_restriction_user_access":"Access restricted by creator","video_clip_share_modal_header":"Share your clip on other platforms","video_clip_sound_restriction_default2":"Clip sound unavailable as it was removed by the copyright holder","video_clip_sound_restriction_error":"The clip volume is muted since the sound used in it is unavailable","video_clip_subscriptions_placeholder":"You\u0026#39;re not following anything yet","video_clip_upload_attach_video":"Привязать к видео","video_clip_upload_attach_video_subtitle":"В клипе будет ссылка на это видео","video_clip_upload_attach_video_tooltip":"В клипе появится кнопка перехода к выбранному горизонтальному видео","video_clip_upload_audio_tooltip":"\u003cb\u003eSelect which
