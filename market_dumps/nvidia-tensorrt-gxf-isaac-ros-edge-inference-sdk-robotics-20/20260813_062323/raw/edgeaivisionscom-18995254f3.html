      {"@type":"Question","name":"What is MIPI CSI?","acceptedAnswer":{"@type":"Answer","text":"Mobile Industry Processor Interface Camera Serial Interface — a high-speed serial protocol for connecting image sensors to a processor. MIPI CSI-2 supports up to 4 data lanes."}},
      {"@type":"Question","name":"What is PCIe (PCI Express)?","acceptedAnswer":{"@type":"Answer","text":"A high-speed serial expansion bus standard used to connect GPUs, NVMe SSDs, AI accelerators, and network adapters. PCIe Gen 4 provides up to 16 GT/s per lane."}},
      {"@type":"Question","name":"What is COM Express?","acceptedAnswer":{"@type":"Answer","text":"A PICMG standard defining pinout and form factor for Computer-on-Modules. COM Express modules provide standardized connectors enabling processor upgrades without carrier board redesign."}},
      {"@type":"Question","name":"What is SMARC?","acceptedAnswer":{"@type":"Answer","text":"Smart Mobility ARChitecture — a SGET standard for small, low-power System-on-Modules (82×50 mm) with a standardised 314-pin edge connector."}},
      {"@type":"Question","name":"What is GMSL?","acceptedAnswer":{"@type":"Answer","text":"Gigabit Multimedia Serial Link — a high-bandwidth, low-latency serial interface used to transmit video, audio, and control data over coax or STP cables. GMSL2 supports up to 6 Gbps."}},
      {"@type":"Question","name":"What is an NPU?","acceptedAnswer":{"@type":"Answer","text":"A Neural Processing Unit — a dedicated hardware accelerator optimised for neural network inference workloads, measured in TOPS (Tera Operations Per Second)."}},
      {"@type":"Question","name":"What is a BSP (Board Support Package)?","acceptedAnswer":{"@type":"Answer","text":"A collection of drivers, bootloaders, device trees, and configuration files that enable an operating system to run on a specific embedded hardware platform."}},

      {"@type":"Question","name":"What is PoE (Power over Ethernet)?","acceptedAnswer":{"@type":"Answer","text":"A technology that delivers electrical power alongside data over standard Ethernet cabling (Cat5e/Cat6), supporting up to 90W per port with IEEE 802.3bt."}}
